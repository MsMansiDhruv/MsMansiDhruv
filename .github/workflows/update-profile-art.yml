name: Refresh profile art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/render_profile_art.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image renderer
        run: pip install pillow

      - name: Render live profile visuals
        run: python scripts/render_profile_art.py

      - name: Commit refreshed visuals
        run: |
          git add assets/*.gif assets/achievements.png
          if git diff --cached --quiet; then
            echo "No profile art changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile visuals"
          git push
