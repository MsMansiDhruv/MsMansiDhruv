name: Refresh profile art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/render_profile_art.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image renderer
        run: pip install pillow

      - name: Render live profile visuals
        run: python scripts/render_profile_art.py

      - name: Commit refreshed visuals
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile visuals"
          file_pattern: "assets/*.gif assets/achievements.png"
