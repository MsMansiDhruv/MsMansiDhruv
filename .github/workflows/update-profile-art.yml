name: Refresh profile art

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Render live contribution visuals
        run: python scripts/render_profile_art.py
      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution art"
          file_pattern: "assets/contrib-heatmap.svg assets/activity.svg"
