<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="100%" height="100%" style="background: transparent; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#111822" />
    </linearGradient>

    <!-- Circular Medal Gradients -->
    <radialGradient id="g-anthropic" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E8957A" />
      <stop offset="60%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#8A3B22" />
    </radialGradient>
    <radialGradient id="g-databricks" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF6A59" />
      <stop offset="60%" stop-color="#FF3621" />
      <stop offset="100%" stop-color="#99190C" />
    </radialGradient>
    <radialGradient id="g-nasa" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B2259" />
    </radialGradient>
    <radialGradient id="g-aws" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFC266" />
      <stop offset="60%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#995C00" />
    </radialGradient>
    <radialGradient id="g-gem" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7DF5CA" />
      <stop offset="60%" stop-color="#2EE6A7" />
      <stop offset="100%" stop-color="#0E7A55" />
    </radialGradient>
    <radialGradient id="g-ghci" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#99DEFF" />
      <stop offset="60%" stop-color="#5EC8FF" />
      <stop offset="100%" stop-color="#1A6A99" />
    </radialGradient>

    <style>
      @keyframes ringPulse {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 0.9; }
      }
      .medal-ring {
        animation: ringPulse 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .medal-ring { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="958" height="188" rx="12" fill="url(#card-bg)" stroke="#21262D" stroke-width="1.5" />

  <!-- 6 Circular Achievement Medallions (evenly spaced across 960px: centers at 85, 239, 393, 547, 701, 855) -->
  <!-- 1. Anthropic MCP -->
  <g transform="translate(88, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#D97757" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-anthropic)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="0" y="-2" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="'JetBrains Mono', Consolas, monospace">MCP</text>
    <text x="0" y="12" text-anchor="middle" fill="#FFF0EB" font-size="9" font-weight="600">ANTHROPIC</text>
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">Anthropic MCP</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">Intro &amp; Advanced · 2026</text>
  </g>

  <!-- 2. Databricks Genie & Spark -->
  <g transform="translate(240, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#FF3621" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-databricks)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <!-- Stacked diamond icon -->
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#FFFFFF" fill-opacity="0.95" />
    <polyline points="-14,0 0,8 14,0" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <polyline points="-14,8 0,16 14,8" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">Databricks</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">Genie, Spark &amp; Perf · 2026</text>
  </g>

  <!-- 3. NASA Open Science -->
  <g transform="translate(394, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#3B82F6" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-nasa)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <path d="M -18 8 Q 0 -16 18 4" fill="none" stroke="#FF4D4D" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800" letter-spacing="0.8">NASA</text>
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">NASA Open Science</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">Essentials · Nov 2026</text>
  </g>

  <!-- 4. AWS Certified -->
  <g transform="translate(548, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#FF9900" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-aws)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="0" y="1" text-anchor="middle" fill="#0D1117" font-size="15" font-weight="800" letter-spacing="0.5">AWS</text>
    <path d="M -14 8 Q 0 16 14 8" fill="none" stroke="#0D1117" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">AWS Certified</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">Cloud Practitioner (CLF)</text>
  </g>

  <!-- 5. SG Analytics GEM & Value-able -->
  <g transform="translate(702, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#2EE6A7" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-gem)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <!-- Gem Diamond -->
    <polygon points="-9,-10 9,-10 15,-2 0,14 -15,-2" fill="#0D1117" fill-opacity="0.9" />
    <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#2EE6A7" stroke-width="1.2" />
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">GEM &amp; Value-able</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">SG Analytics · 2023–24</text>
  </g>

  <!-- 6. GHCI & MCA Merit -->
  <g transform="translate(856, 72)">
    <circle cx="0" cy="0" r="42" fill="#161B22" stroke="#5EC8FF" stroke-width="2" class="medal-ring" />
    <circle cx="0" cy="0" r="35" fill="url(#g-ghci)" />
    <circle cx="0" cy="0" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="0" y="-2" text-anchor="middle" fill="#0D1117" font-size="13" font-weight="800">GHCI</text>
    <text x="0" y="12" text-anchor="middle" fill="#0D1117" font-size="9.5" font-weight="700">SCHOLAR</text>
    <text x="0" y="64" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">Academic &amp; GHCI</text>
    <text x="0" y="81" text-anchor="middle" fill="#8B949E" font-size="10.5">Grace Hopper &amp; MCA Merit</text>
  </g>
</svg>