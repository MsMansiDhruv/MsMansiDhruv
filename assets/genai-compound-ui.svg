  <!-- Main Horizontal Divider -->
  <line x1="24" y1="52" x2="936" y2="52" stroke="#17352F" stroke-width="1" />

  <!-- Left Panel: Genie-Bench Semantic Layer (Option C) -->
  <g transform="translate(24, 68)">
    <rect width="440" height="270" rx="10" fill="url(#card-grad-1)" stroke="#1F473E" stroke-width="1" />
    
    <!-- Header -->
