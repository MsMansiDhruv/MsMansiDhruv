<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="ui-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#091B17" />
      <stop offset="100%" stop-color="#050E0C" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2721" />
      <stop offset="100%" stop-color="#081A16" />
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102533" />
      <stop offset="100%" stop-color="#091620" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" />
      <stop offset="100%" stop-color="#5EC8FF" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#5EC8FF" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0% { opacity: 0.6; }
        50% { opacity: 1.0; }
        100% { opacity: 0.6; }
      }
      .live-dot {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="560" fill="url(#ui-bg)" rx="16" />
  <rect x="1" y="1" width="958" height="558" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="544" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Corner Guides -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 16 532 L 16 544 L 28 544" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 532 L 944 544 L 932 544" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="12" cy="14" r="5" fill="#FF5F56" />
    <circle cx="28" cy="14" r="5" fill="#FFBD2E" />
    <circle cx="44" cy="14" r="5" fill="#27C93F" />
    <text x="64" y="18" fill="#E2F1ED" font-size="13" font-weight="700" letter-spacing="0.5">Sentinel-GenAI Studio</text>
    <text x="216" y="18" fill="#5E8A80" font-size="12">|</text>
    <text x="228" y="18" fill="#7FA99F" font-size="12">Databricks Genie Semantic Harness &amp; Autonomous Agentic Lakehouse</text>

    <!-- Status Badges -->
    <rect x="740" y="4" width="80" height="20" rx="10" fill="#0E332B" stroke="#2EE6A7" stroke-width="1" />
    <circle cx="752" cy="14" r="3.5" fill="#2EE6A7" class="live-dot" />
    <text x="762" y="18" fill="#2EE6A7" font-size="10" font-weight="700" letter-spacing="0.5">GENIE AI/BI</text>

    <rect x="830" y="4" width="76" height="20" rx="10" fill="#142B38" stroke="#5EC8FF" stroke-width="1" />
    <circle cx="842" cy="14" r="3.5" fill="#5EC8FF" class="live-dot" />
    <text x="852" y="18" fill="#5EC8FF" font-size="10" font-weight="700" letter-spacing="0.5">AUTO-HEAL</text>
