      <rect x="0" y="0" width="128" height="92" rx="6" fill="#071512" stroke="#163830" stroke-width="1" />
      <text x="12" y="22" fill="#7FA99F" font-size="10" font-weight="700">INTENT ACCURACY</text>
      <text x="12" y="52" fill="#2EE6A7" font-size="24" font-weight="800">100.0%</text>
      <text x="12" y="74" fill="#5E8A80" font-size="10">Zero-hallucination</text>

      <!-- Metric 2 -->
      <rect x="138" y="0" width="128" height="92" rx="6" fill="#071512" stroke="#163830" stroke-width="1" />
      <text x="12" y="22" fill="#7FA99F" font-size="10" font-weight="700">AST SAFETY</text>
      <text x="12" y="52" fill="#5EC8FF" font-size="24" font-weight="800">PASSED</text>
      <text x="12" y="74" fill="#5E8A80" font-size="10">DDL/DML Guarded</text>

      <!-- Metric 3 -->
      <rect x="276" y="0" width="128" height="92" rx="6" fill="#071512" stroke="#163830" stroke-width="1" />
      <text x="12" y="22" fill="#7FA99F" font-size="10" font-weight="700">AVG LATENCY</text>
      <text x="12" y="52" fill="#FF9B4A" font-size="24" font-weight="800">0.13ms</text>
      <text x="12" y="74" fill="#5E8A80" font-size="10">In-memory compiled</text>
