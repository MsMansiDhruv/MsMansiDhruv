      <text x="28" y="54" fill="#5EC8FF" font-size="10" class="code-font">Affected slice: [2026-10-27 .. 2026-11-02] · Blast radius: 7 days</text>
    </g>

    <!-- Autonomous Remediation Steps -->
    <g transform="translate(18, 140)">
      <rect width="406" height="114" rx="6" fill="#071219" stroke="#162E3D" stroke-width="1" />
      <text x="14" y="20" fill="#7FB1C9" font-size="10" font-weight="700">AUTONOMOUS REMEDIATION TRACE</text>

      <g transform="translate(14, 32)">
        <!-- Step 1 -->
        <circle cx="6" cy="8" r="3" fill="#2EE6A7" />
        <text x="16" y="11" fill="#DDF4FF" font-size="10">1. Delta Commit Log Inspection: Zero-scan SLA metadata gate triggered</text>
        
        <!-- Step 2 -->
        <circle cx="6" cy="28" r="3" fill="#2EE6A7" />
        <text x="16" y="31" fill="#DDF4FF" font-size="10">2. Delta MERGE Generation: Partition-pruned surgical backfill generated</text>

        <!-- Step 3 -->
        <circle cx="6" cy="48" r="3" fill="#2EE6A7" />
        <text x="16" y="51" fill="#DDF4FF" font-size="10">3. Verification Gate: Recalculated Gold ledger contiguity score: 100%</text>

        <!-- Step 4 -->
        <circle cx="6" cy="68" r="3" fill="#5EC8FF" />
        <text x="16" y="71" fill="#5EC8FF" font-size="10" font-weight="700">Action: Restated 7 historical window slices with zero full-table recompute</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: Interactive Compound Query Router Console (Option A + B + C Unified) -->
  <g transform="translate(24, 356)">
    <rect width="912" height="184" rx="10" fill="#081613" stroke="#1B3D34" stroke-width="1" />
    
    <!-- Console Prompt Header -->
