      <rect x="0" y="-4" width="96" height="18" rx="4" fill="#13362C" stroke="#2EE6A7" stroke-width="0.75" />
      <text x="8" y="9" fill="#2EE6A7" font-size="9" font-weight="800" letter-spacing="0.5">HYBRID PROMPT</text>
      <text x="108" y="10" fill="#F0FDF8" font-size="12" font-weight="700">"What is our monthly gross revenue, and what are the Platinum SLA downtime penalties?"</text>
    </g>

    <!-- Execution Plan Bar -->
    <g transform="translate(20, 52)">
      <rect width="872" height="28" rx="4" fill="#040C0A" stroke="#112923" stroke-width="0.75" />
      
      <circle cx="16" cy="14" r="3" fill="#2EE6A7" />
      <text x="26" y="17" fill="#7FA99F" font-size="10">Router Intent:</text>
      <text x="96" y="17" fill="#2EE6A7" font-size="10" font-weight="700">HYBRID (SQL Aggregation + Unstructured Vector Search)</text>

      <text x="440" y="17" fill="#5E8A80" font-size="10">|</text>
      <text x="454" y="17" fill="#7FA99F" font-size="10">Fusion Algorithm:</text>
      <text x="548" y="17" fill="#5EC8FF" font-size="10" font-weight="700">Reciprocal Rank Fusion (RRF k=60)</text>

      <text x="740" y="17" fill="#5E8A80" font-size="10">Guardrail:</text>
      <text x="792" y="17" fill="#2EE6A7" font-size="10" font-weight="700">PASSED</text>
    </g>

    <!-- Synthesized Grounded Output -->
    <g transform="translate(20, 92)">
      <rect width="872" height="74" rx="4" fill="#040C0A" stroke="#112923" stroke-width="0.75" />
      
      <!-- Analytical Column Output -->
      <g transform="translate(14, 16)">
        <text x="0" y="0" fill="#2EE6A7" font-size="10" font-weight="700">STRUCTURED FINDINGS (Databricks SQL / Genie):</text>
        <text x="0" y="18" fill="#CDEAE2" font-size="10" class="code-font">- 2026-10: $1,425,000.50 (8,420 orders) · 2026-09: $1,380,200.00 (8,110 orders)</text>
        <text x="0" y="34" fill="#7FA99F" font-size="9">Lineage: sentinel_prod.gold.fact_orders · Verified via Trusted Catalog #monthly_gross_revenue</text>
      </g>

      <!-- SLA Policy Vector Output -->
      <g transform="translate(470, 16)">
        <text x="0" y="0" fill="#5EC8FF" font-size="10" font-weight="700">GOVERNANCE CONTEXT (Mosaic AI Vector Search):</text>
        <text x="0" y="18" fill="#D4ECF9" font-size="10">- [doc-sla-2026] Platinum SLA requires 99.99% uptime; failure penalty rate: $10,000/hr.</text>
        <text x="0" y="34" fill="#678E9F" font-size="9">Matched: dense cosine (0.842) + sparse BM25 (2.19) · Preserved Markdown table chunk</text>
      </g>
    </g>
  </g>
</svg>
