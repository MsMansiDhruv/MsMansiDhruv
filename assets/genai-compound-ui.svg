    <text x="18" y="46" fill="#F0FDF8" font-size="14" font-weight="700">Unity Catalog Semantic Compiler &amp; Trusted Queries</text>
    
    <!-- Table Annotation Tree -->
    <g transform="translate(18, 62)">
      <rect width="404" height="88" rx="6" fill="#071512" stroke="#163830" stroke-width="1" />
      <text x="12" y="20" fill="#7FA99F" font-size="10" font-weight="700">GOVERNED CATALOG TARGET</text>
      <text x="175" y="20" fill="#2EE6A7" font-size="10" class="code-font">sentinel_prod.gold.fact_orders</text>
      
      <!-- Columns chips -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="112" height="20" rx="4" fill="#0C2520" stroke="#1C4B40" stroke-width="0.75" />
        <text x="8" y="14" fill="#2EE6A7" font-size="10" class="code-font">order_id (PK)</text>
        
        <rect x="120" y="0" width="124" height="20" rx="4" fill="#0C2520" stroke="#1C4B40" stroke-width="0.75" />
        <text x="128" y="14" fill="#5EC8FF" font-size="10" class="code-font">order_date (DATE)</text>

        <rect x="252" y="0" width="134" height="20" rx="4" fill="#0C2520" stroke="#1C4B40" stroke-width="0.75" />
        <text x="260" y="14" fill="#FF9B4A" font-size="10" class="code-font">total_amount (DEC)</text>
      </g>

      <!-- Trusted Query Preview -->
