<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C0B" />
      <stop offset="50%" stop-color="#071714" />
      <stop offset="100%" stop-color="#040C0B" />
    </linearGradient>

    <!-- Radial Hub Glows -->
    <radialGradient id="glow-tata" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EC8FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5EC8FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-acorns" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2EE6A7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-sentinel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9B4A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cuda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C5C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5C5C" stop-opacity="0" />
    </radialGradient>

    <!-- Arc Gradients -->
    <linearGradient id="arc-cyan-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EC8FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2EE6A7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5EC8FF" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="arc-green-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FF9B4A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF5C5C" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="arc-dense-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C5C" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF9B4A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2EE6A7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes rayFlowFast {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rayFlowSlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes hubPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes ringBurst {
        0% { r: 6; opacity: 0.9; }
        100% { r: 28; opacity: 0; }
      }
      @keyframes scrubberTravel {
        0% { transform: translateX(0px); }
        50% { transform: translateX(180px); }
        100% { transform: translateX(0px); }
      }
      .ray-fast {
        stroke-dasharray: 8 12;
        animation: rayFlowFast 3.2s linear infinite;
      }
      .ray-medium {
        stroke-dasharray: 14 18;
        animation: rayFlowFast 5s linear infinite;
      }
      .ray-slow {
        stroke-dasharray: 20 30;
        animation: rayFlowSlow 8s linear infinite;
      }
      .pulse-hub {
        animation: hubPulse 3.5s ease-in-out infinite;
      }
      .burst-ring {
        animation: ringBurst 2.8s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
      }
      .scrubber-head {
        animation: scrubberTravel 12s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="520" fill="url(#space-bg)" rx="16" />
  
  <!-- Outer Borders -->
  <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="504" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Corner Crosshairs -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 16 492 L 16 504 L 28 504" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 492 L 944 504 L 932 504" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Top Status Strip -->
  <g transform="translate(36, 36)">
    <circle cx="4" cy="4" r="3" fill="#2EE6A7" />
    <text x="16" y="8" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.5">SPACE-TIME TRAJECTORY CONTINUUM // 7+ YEARS PRODUCTION SYSTEMS NETWORK</text>
    <text x="888" y="8" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">COORD: L4-DISTRIBUTED · FLUX DENSITY: HIGH · FPS: 60</text>
  </g>
  <line x1="36" y1="52" x2="924" y2="52" stroke="#17352F" stroke-width="1" />

  <!-- Atmospheric Grid Overlay -->
  <g opacity="0.15">
    <line x1="100" y1="60" x2="100" y2="440" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="300" y1="60" x2="300" y2="440" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="500" y1="60" x2="500" y2="440" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="700" y1="60" x2="700" y2="440" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="900" y1="60" x2="900" y2="440" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="40" y1="150" x2="920" y2="150" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="40" y1="280" x2="920" y2="280" stroke="#2EE6A7" stroke-dasharray="2 6" />
    <line x1="40" y1="390" x2="920" y2="390" stroke="#2EE6A7" stroke-dasharray="2 6" />
  </g>

  <!-- ================= HIGH-DENSITY FLIGHT-ARC NETWORK RAYS ================= -->
  <!-- Hub Coordinates:
       Hub 0 (Foundations / MCA / GEM Award): (160, 360)
       Hub 1 (Tata AMC / AWS Data Platform): (240, 210)
       Hub 2 (Acorns / Databricks & Streaming): (520, 260)
       Hub 3 (Sentinel Lakehouse / Lead Architecture): (760, 180)
       Hub 4 (Accelerated Frontier / CUDA & GPU): (620, 100)
  -->

  <!-- Hub Glows -->
  <circle cx="160" cy="360" r="70" fill="url(#glow-tata)" />
  <circle cx="240" cy="210" r="80" fill="url(#glow-tata)" />
  <circle cx="520" cy="260" r="100" fill="url(#glow-acorns)" />
  <circle cx="760" cy="180" r="110" fill="url(#glow-sentinel)" />
  <circle cx="620" cy="100" r="85" fill="url(#glow-cuda)" />

  <!-- Dense Streaming Arcs (Background Static Network Mesh) -->
  <g stroke="#17352F" stroke-width="0.8" opacity="0.6">
    <!-- Hub 0 to All -->
    <path d="M 160 360 Q 200 280 240 210" fill="none" />
    <path d="M 160 360 Q 320 330 520 260" fill="none" />
    <path d="M 160 360 Q 450 310 760 180" fill="none" />
    <path d="M 160 360 Q 380 200 620 100" fill="none" />

    <!-- Hub 1 to All -->
    <path d="M 240 210 Q 380 220 520 260" fill="none" />
    <path d="M 240 210 Q 480 160 760 180" fill="none" />
    <path d="M 240 210 Q 420 120 620 100" fill="none" />

    <!-- Hub 2 to All -->
    <path d="M 520 260 Q 640 240 760 180" fill="none" />
    <path d="M 520 260 Q 580 170 620 100" fill="none" />

    <!-- Hub 3 to Hub 4 -->
    <path d="M 760 180 Q 700 120 620 100" fill="none" />

    <!-- Secondary Radiant Fan Rays (Flight-density style fan-out) -->
    <line x1="240" y1="210" x2="520" y2="250" />
    <line x1="240" y1="210" x2="520" y2="270" />
    <line x1="240" y1="210" x2="760" y2="170" />
    <line x1="240" y1="210" x2="760" y2="190" />
    <line x1="520" y1="260" x2="760" y2="160" />
    <line x1="520" y1="260" x2="760" y2="200" />
    <line x1="520" y1="260" x2="620" y2="85" />
    <line x1="520" y1="260" x2="620" y2="115" />
    <line x1="760" y1="180" x2="620" y2="80" />
    <line x1="760" y1="180" x2="620" y2="120" />
  </g>

  <!-- Animated High-Density Radiant Rays (Curved Beziers & Beams) -->
  <g>
    <!-- Stream 1: Foundations to Cloud Platform (AWS / Tata AMC) -->
    <path d="M 160 360 Q 180 270 240 210" fill="none" stroke="url(#arc-cyan-green)" stroke-width="2" class="ray-fast" />
    <path d="M 160 360 Q 210 290 240 210" fill="none" stroke="#5EC8FF" stroke-width="1.2" class="ray-medium" />

    <!-- Stream 2: Cloud Ingest to Databricks / Acorns Streaming -->
    <path d="M 240 210 Q 370 200 520 260" fill="none" stroke="url(#arc-cyan-green)" stroke-width="2.5" class="ray-fast" />
    <path d="M 240 210 Q 390 240 520 260" fill="none" stroke="#2EE6A7" stroke-width="1.8" class="ray-medium" />
    <path d="M 240 210 Q 360 260 520 260" fill="none" stroke="#FF9B4A" stroke-width="1" class="ray-slow" />

    <!-- Stream 3: Real-Time Streaming to Sentinel Lakehouse Architecture -->
    <path d="M 520 260 Q 630 200 760 180" fill="none" stroke="url(#arc-green-orange)" stroke-width="3" class="ray-fast" />
    <path d="M 520 260 Q 650 230 760 180" fill="none" stroke="#FF9B4A" stroke-width="2" class="ray-medium" />
    <path d="M 520 260 Q 670 260 760 180" fill="none" stroke="#FF5C5C" stroke-width="1.5" class="ray-slow" />

    <!-- Stream 4: Foundations directly to Sentinel (7-Year Trajectory Arc) -->
    <path d="M 160 360 Q 460 380 760 180" fill="none" stroke="url(#arc-green-orange)" stroke-width="2.2" class="ray-medium" />
    <path d="M 160 360 Q 440 350 760 180" fill="none" stroke="#2EE6A7" stroke-width="1.2" class="ray-fast" />

    <!-- Stream 5: Spark / Lakehouse Core to GPU & CUDA Accelerated Frontier -->
    <path d="M 520 260 Q 550 160 620 100" fill="none" stroke="url(#arc-dense-red)" stroke-width="2.8" class="ray-fast" />
    <path d="M 760 180 Q 710 110 620 100" fill="none" stroke="url(#arc-dense-red)" stroke-width="3" class="ray-fast" />
    <path d="M 240 210 Q 420 90 620 100" fill="none" stroke="#FF5C5C" stroke-width="1.8" class="ray-medium" />
    <path d="M 160 360 Q 380 120 620 100" fill="none" stroke="#FF9B4A" stroke-width="1.4" class="ray-slow" />

    <!-- Radiant Multi-Line Burst Rays (Like Flight Map Dense Lines) -->
    <line x1="520" y1="260" x2="760" y2="180" stroke="#FF9B4A" stroke-width="1.2" opacity="0.7" stroke-dasharray="6 4" class="ray-fast" />
    <line x1="520" y1="260" x2="620" y2="100" stroke="#FF5C5C" stroke-width="1.5" opacity="0.8" stroke-dasharray="8 6" class="ray-fast" />
    <line x1="240" y1="210" x2="620" y2="100" stroke="#5EC8FF" stroke-width="1.2" opacity="0.6" stroke-dasharray="10 8" class="ray-medium" />
  </g>

  <!-- Point Density Particle Sprays around Main Hubs -->
  <g opacity="0.85">
    <!-- Around Hub 0 -->
    <circle cx="145" cy="345" r="1.5" fill="#5EC8FF" />
    <circle cx="170" cy="375" r="1.2" fill="#2EE6A7" />
    <circle cx="135" cy="365" r="1" fill="#5EC8FF" />
    <circle cx="175" cy="340" r="1.5" fill="#2EE6A7" />

    <!-- Around Hub 1 (Tata AMC / AWS) -->
    <circle cx="225" cy="195" r="1.5" fill="#5EC8FF" />
    <circle cx="255" cy="225" r="2" fill="#2EE6A7" />
    <circle cx="215" cy="220" r="1.2" fill="#5EC8FF" />
    <circle cx="260" cy="190" r="1.8" fill="#FF9B4A" />

    <!-- Around Hub 2 (Acorns / Databricks) -->
    <circle cx="505" cy="240" r="2" fill="#2EE6A7" />
    <circle cx="535" cy="275" r="2.5" fill="#2EE6A7" />
    <circle cx="495" cy="270" r="1.5" fill="#5EC8FF" />
    <circle cx="545" cy="245" r="2.2" fill="#FF9B4A" />
    <circle cx="510" cy="285" r="1.5" fill="#FF5C5C" />

    <!-- Around Hub 3 (Sentinel Lakehouse) -->
    <circle cx="740" cy="165" r="2.5" fill="#FF9B4A" />
    <circle cx="780" cy="195" r="2" fill="#FF9B4A" />
    <circle cx="745" cy="195" r="1.8" fill="#2EE6A7" />
    <circle cx="775" cy="160" r="2.5" fill="#FF5C5C" />
    <circle cx="790" cy="175" r="1.5" fill="#FFC085" />

    <!-- Around Hub 4 (Accelerated GPU Frontier) -->
    <circle cx="605" cy="85" r="2" fill="#FF5C5C" />
    <circle cx="635" cy="115" r="2.5" fill="#FF5C5C" />
    <circle cx="600" cy="110" r="1.5" fill="#FF9B4A" />
    <circle cx="640" cy="85" r="2.2" fill="#2EE6A7" />
  </g>

  <!-- ================= TECHNICAL HUB CORES & LABELS ================= -->
  
  <!-- HUB 0: Foundations & Academic Core -->
  <g transform="translate(160, 360)">
    <circle cx="0" cy="0" r="6" fill="#5EC8FF" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#5EC8FF" stroke-width="1.2" class="burst-ring" />
    <rect x="-95" y="14" width="190" height="42" rx="5" fill="#0A1715" stroke="#17352F" stroke-width="1" />
    <text x="0" y="29" text-anchor="middle" fill="#5EC8FF" font-size="10.5" font-weight="700">FOUNDATIONS &amp; MCA</text>
    <text x="0" y="44" text-anchor="middle" fill="#91A8A2" font-size="8.5" font-family="monospace">Master's · GEM Award · ETL</text>
  </g>

  <!-- HUB 1: Tata AMC AWS Migration & Platform -->
  <g transform="translate(240, 210)">
    <circle cx="0" cy="0" r="7" fill="#2EE6A7" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#2EE6A7" stroke-width="1.5" class="burst-ring" />
    <rect x="-115" y="-52" width="230" height="44" rx="5" fill="#0A1715" stroke="#2EE6A7" stroke-width="1" />
    <text x="0" y="-37" text-anchor="middle" fill="#2EE6A7" font-size="10.5" font-weight="700">TATA AMC // AWS MIGRATION</text>
    <text x="0" y="-22" text-anchor="middle" fill="#EAF4F0" font-size="8.5" font-family="monospace">Glue · Redshift · 10+ TB · Terraform</text>
  </g>

  <!-- HUB 2: Acorns Databricks & Real-Time Lakehouse -->
  <g transform="translate(520, 260)">
    <circle cx="0" cy="0" r="8" fill="#2EE6A7" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#2EE6A7" stroke-width="1.5" class="burst-ring" />
    <rect x="-120" y="16" width="240" height="44" rx="5" fill="#0B1D1A" stroke="#2EE6A7" stroke-width="1.2" />
    <text x="0" y="32" text-anchor="middle" fill="#2EE6A7" font-size="11" font-weight="700">ACORNS // REAL-TIME LAKEHOUSE</text>
    <text x="0" y="47" text-anchor="middle" fill="#EAF4F0" font-size="8.5" font-family="monospace">Spark · Delta DLT · Kafka · 40% Faster</text>
  </g>

  <!-- HUB 3: Sentinel Lakehouse Lead Architecture -->
  <g transform="translate(760, 180)">
    <circle cx="0" cy="0" r="8.5" fill="#FF9B4A" />
    <circle cx="0" cy="0" r="8.5" fill="none" stroke="#FF9B4A" stroke-width="1.8" class="burst-ring" />
    <rect x="-125" y="-54" width="250" height="44" rx="5" fill="#0A1715" stroke="#FF9B4A" stroke-width="1.2" />
    <text x="0" y="-38" text-anchor="middle" fill="#FFC085" font-size="11" font-weight="700">SENTINEL LAKEHOUSE ARCHITECTURE</text>
    <text x="0" y="-23" text-anchor="middle" fill="#EAF4F0" font-size="8.5" font-family="monospace">Auto Loader · CDF · SCD2 · 24% Scan Opt.</text>
  </g>

  <!-- HUB 4: NVIDIA CUDA & Accelerated Systems Frontier -->
  <g transform="translate(620, 100)">
    <circle cx="0" cy="0" r="9" fill="#FF5C5C" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#FF5C5C" stroke-width="2" class="burst-ring" />
    <rect x="-120" y="-48" width="240" height="40" rx="5" fill="#0A1715" stroke="#FF5C5C" stroke-width="1.2" />
    <text x="0" y="-33" text-anchor="middle" fill="#FF5C5C" font-size="11" font-weight="700">ACCELERATED SYSTEMS FRONTIER</text>
    <text x="0" y="-19" text-anchor="middle" fill="#FFC085" font-size="8.5" font-family="monospace">Parallel Computing · CUDA · RAPIDS cuDF</text>
  </g>

  <!-- ================= CINEMATIC MEDIA CONTROLLER / TIME HUD ================= -->
  <g transform="translate(180, 452)">
    <!-- Main Controller Bar Pill -->
    <rect x="0" y="0" width="600" height="46" rx="8" fill="#081A16" stroke="#17352F" stroke-width="1.2" />

    <!-- Play/Pause Button Pill -->
    <g transform="translate(14, 9)">
      <rect x="0" y="0" width="30" height="28" rx="5" fill="#0A221C" stroke="#2EE6A7" stroke-width="1" />
      <rect x="9" y="8" width="4" height="12" fill="#2EE6A7" rx="1" />
      <rect x="17" y="8" width="4" height="12" fill="#2EE6A7" rx="1" />
    </g>

    <!-- Timestamp Indicator -->
    <text x="56" y="27" fill="#EAF4F0" font-size="11.5" font-weight="700" font-family="monospace">15:03 UTC</text>

    <!-- Timeline Scrubber Track -->
    <g transform="translate(145, 23)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#17352F" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="0" x2="160" y2="0" stroke="#2EE6A7" stroke-width="3" stroke-linecap="round" />
      
      <!-- Animated Scrubber Head -->
      <g class="scrubber-head">
        <circle cx="60" cy="0" r="6" fill="#2EE6A7" stroke="#06100E" stroke-width="2" />
        <circle cx="60" cy="0" r="10" fill="none" stroke="#2EE6A7" stroke-width="1" opacity="0.6" />
      </g>
    </g>

    <!-- Speed Mode Toggle Buttons -->
    <g transform="translate(445, 11)">
      <!-- 1x -->
      <rect x="0" y="0" width="28" height="24" rx="4" fill="#0A1715" stroke="#17352F" stroke-width="1" />
      <text x="14" y="16" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">1x</text>

      <!-- 2x -->
      <rect x="34" y="0" width="28" height="24" rx="4" fill="#0A1715" stroke="#17352F" stroke-width="1" />
      <text x="48" y="16" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">2x</text>

      <!-- 6x -->
      <rect x="68" y="0" width="28" height="24" rx="4" fill="#0A1715" stroke="#17352F" stroke-width="1" />
      <text x="82" y="16" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">6x</text>

      <!-- 12x (Active) -->
      <rect x="102" y="0" width="36" height="24" rx="4" fill="#0A221C" stroke="#2EE6A7" stroke-width="1.2" />
      <text x="120" y="16" text-anchor="middle" fill="#2EE6A7" font-size="9.5" font-weight="700" font-family="monospace">12x</text>
    </g>
  </g>
</svg>
