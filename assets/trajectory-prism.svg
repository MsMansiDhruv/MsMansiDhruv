<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="prism-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#091916" />
      <stop offset="100%" stop-color="#06100E" />
    </linearGradient>

    <!-- Prism Wireframe Gradients -->
    <linearGradient id="beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#2EE6A7" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#5EC8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF9B4A" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="prism-facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06100E" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="prism-facet-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EC8FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06100E" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="prism-facet-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06100E" stop-opacity="0.03" />
    </linearGradient>

    <radialGradient id="prism-core-glow" cx="48%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06100E" stop-opacity="0" />
    </radialGradient>

    <!-- Animation Styles -->
    <style>
      @keyframes timelinePulse {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconRing {
        0% { r: 4; opacity: 0.9; }
        100% { r: 16; opacity: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .timeline-beam {
        stroke-dasharray: 10 6;
        animation: timelinePulse 5s linear infinite;
      }
      .node-beacon {
        animation: beaconRing 2.4s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
      }
      .prism-layer {
        animation: floatNode 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="480" fill="url(#prism-bg)" rx="16" />
  <rect width="960" height="480" fill="url(#prism-core-glow)" rx="16" />

  <!-- Outer Borders -->
  <rect x="1" y="1" width="958" height="478" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="464" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Corner Ticks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 16 452 L 16 464 L 28 464" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 452 L 944 464 L 932 464" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Header Strip -->
  <g transform="translate(36, 38)">
    <circle cx="4" cy="4" r="3" fill="#2EE6A7" />
    <text x="16" y="8" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.5">SPACE-TIME TRAJECTORY PRISM // 7-YEAR RECORD &amp; ACCELERATED DIRECTION</text>
    <text x="888" y="8" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">AXIS: TIME (7+ YRS) × SCALE × DEPTH</text>
  </g>
  <line x1="36" y1="56" x2="924" y2="56" stroke="#17352F" stroke-width="1" />

  <!-- Left: Space-Time Prism Isometric Geometry -->
  <g class="prism-layer" transform="translate(180, 260)">
    <!-- Isometric Prism Grid Base (T=0: 2017 Foundations) -->
    <polygon points="-110,120 0,70 110,120 0,170" fill="none" stroke="#17352F" stroke-width="1.2" stroke-dasharray="3 3" />
    
    <!-- Mid Plane 1 (T=1: 2020 Cloud & Production Lakehouse) -->
    <polygon points="-100,30 0,-15 100,30 0,75" fill="url(#prism-facet-1)" stroke="#2EE6A7" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Mid Plane 2 (T=2: 2024 Lead & Performance Engineering) -->
    <polygon points="-85,-60 0,-100 85,-60 0,-20" fill="url(#prism-facet-2)" stroke="#5EC8FF" stroke-width="1.4" stroke-opacity="0.8" />

    <!-- Top Apex Cone (T=3: Accelerated Systems Frontier) -->
    <polygon points="-60,-150 0,-185 60,-150 0,-115" fill="url(#prism-facet-3)" stroke="#FF9B4A" stroke-width="1.6" />

    <!-- Vertical Prism Spine Rays -->
    <line x1="-110" y1="120" x2="-60" y2="-150" stroke="#17352F" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="110" y1="120" x2="60" y2="-150" stroke="#17352F" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="0" y1="170" x2="0" y2="-115" stroke="#17352F" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Central Trajectory Beam passing up the Time Axis -->
    <path d="M 0,120 L 0,30 L 0,-60 L 0,-150" fill="none" stroke="#17352F" stroke-width="3" />
    <path d="M 0,120 L 0,30 L 0,-60 L 0,-150" fill="none" stroke="url(#beam-grad)" stroke-width="3" class="timeline-beam" />

    <!-- Trajectory Core Nodes along the Prism Spine -->
    <!-- Node T0 -->
    <circle cx="0" cy="120" r="4.5" fill="#2EE6A7" />
    <!-- Node T1 -->
    <circle cx="0" cy="30" r="5" fill="#2EE6A7" />
    <!-- Node T2 -->
    <circle cx="0" cy="-60" r="5.5" fill="#5EC8FF" />
    <circle cx="0" cy="-60" r="5.5" fill="none" stroke="#5EC8FF" stroke-width="1.2" class="node-beacon" />
    <!-- Node T3 -->
    <circle cx="0" cy="-150" r="6" fill="#FF9B4A" />
    <circle cx="0" cy="-150" r="6" fill="none" stroke="#FF9B4A" stroke-width="1.5" class="node-beacon" />

    <!-- Time Axis Guide on Left -->
    <line x1="-135" y1="140" x2="-135" y2="-160" stroke="#2EE6A7" stroke-width="1.2" />
    <polygon points="-135,-165 -139,-155 -131,-155" fill="#2EE6A7" />
    <text x="-142" y="-5" text-anchor="end" fill="#2EE6A7" font-size="9" font-family="monospace" transform="rotate(-90 -142 -5)">TIME / CAREER CONTINUUM →</text>
  </g>

  <!-- Right: 4-Tier Proven Value & Trajectory Cards -->
  <g transform="translate(390, 75)">

    <!-- Tier 4: FUTURE ARCS (T=3) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="534" height="84" rx="8" fill="#0A1715" stroke="#FF9B4A" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="84" rx="3" fill="#FF9B4A" />
      
      <circle cx="24" cy="22" r="4" fill="#FF9B4A" />
      <text x="36" y="26" fill="#FFC085" font-size="12" font-weight="700" letter-spacing="0.5">LONGER ARC: ACCELERATED DATA SYSTEMS</text>
      <text x="520" y="26" text-anchor="end" fill="#FF9B4A" font-size="10" font-family="monospace">2026+</text>

      <text x="24" y="48" fill="#EAF4F0" font-size="10.5" font-weight="600">Parallel Computing · NVIDIA CUDA · RAPIDS / cuDF · GPU Lakehouses</text>
      <text x="24" y="68" fill="#91A8A2" font-size="9.5" font-family="monospace">Goal: Kernel-level query acceleration &amp; high-throughput vector processing.</text>
    </g>

    <!-- Tier 3: LEAD & PERFORMANCE ENGINEERING (T=2: Present) -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="534" height="84" rx="8" fill="#0B1D1A" stroke="#5EC8FF" stroke-width="1.2" />
      <rect x="0" y="0" width="6" height="84" rx="3" fill="#5EC8FF" />

      <circle cx="24" cy="22" r="4" fill="#5EC8FF" />
      <text x="36" y="26" fill="#5EC8FF" font-size="12" font-weight="700" letter-spacing="0.5">PRESENT: DISTRIBUTED SYSTEMS &amp; PERFORMANCE</text>
      <text x="520" y="26" text-anchor="end" fill="#5EC8FF" font-size="10" font-family="monospace">LEAD ROLE</text>

      <text x="24" y="48" fill="#EAF4F0" font-size="10.5" font-weight="600">Query Execution Internals · Shuffle Optimization · Partition Skew &amp; Memory</text>
      <text x="24" y="68" fill="#91A8A2" font-size="9.5" font-family="monospace">Impact: Measured 24% byte scan optimization; cost &amp; latency trade-off engineering.</text>
    </g>

    <!-- Tier 2: CLOUD & LAKEHOUSE ARCHITECTURE (T=1) -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="534" height="84" rx="8" fill="#0A1715" stroke="#2EE6A7" stroke-width="1" />
      <rect x="0" y="0" width="6" height="84" rx="3" fill="#2EE6A7" />

      <circle cx="24" cy="22" r="4" fill="#2EE6A7" />
      <text x="36" y="26" fill="#2EE6A7" font-size="12" font-weight="700" letter-spacing="0.5">PRODUCTION SCALE: AWS &amp; DATABRICKS LAKEHOUSE</text>
      <text x="520" y="26" text-anchor="end" fill="#2EE6A7" font-size="10" font-family="monospace">MULTI-YEAR</text>

      <text x="24" y="48" fill="#EAF4F0" font-size="10.5" font-weight="600">Spark/PySpark · Delta Lake · Auto Loader · CDC / SCD2 · Unity Catalog · CI/CD</text>
      <text x="24" y="68" fill="#91A8A2" font-size="9.5" font-family="monospace">Impact: Petabyte-scale medallion architectures with automated quality quarantine.</text>
    </g>

    <!-- Tier 1: FOUNDATIONS (T=0) -->
    <g transform="translate(0, 288)">
      <rect x="0" y="0" width="534" height="74" rx="8" fill="#071614" stroke="#17352F" stroke-width="1" />
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#17352F" />

      <circle cx="24" cy="22" r="4" fill="#91A8A2" />
      <text x="36" y="26" fill="#EAF4F0" font-size="12" font-weight="700" letter-spacing="0.5">FOUNDATIONS: DATA PLATFORMS &amp; SYSTEMS ACADEMICS</text>
      <text x="520" y="26" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">7+ YRS AGO</text>

      <text x="24" y="48" fill="#91A8A2" font-size="10" font-weight="600">Master's Graduate · Python · SQL Modeling · ETL/ELT Engines · GEM Award</text>
    </g>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(36, 442)">
    <rect x="0" y="0" width="888" height="26" rx="4" fill="#071614" />
    <text x="12" y="17" fill="#91A8A2" font-size="9.5" font-family="monospace">
      CORE IDENTITY: <tspan fill="#2EE6A7">7+ YEARS PRODUCTION DATA SYSTEMS</tspan> → <tspan fill="#5EC8FF">DISTRIBUTED PERFORMANCE</tspan> → <tspan fill="#FF9B4A">ACCELERATED ARCHITECTURES</tspan>
    </text>
  </g>
</svg>
