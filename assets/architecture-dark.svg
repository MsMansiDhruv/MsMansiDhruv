<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470">
<defs>
<style>
.bg{fill:#090D0B}.panel{fill:#101713;stroke:#2EC4B6;stroke-opacity:.2}.h{font:700 27px Georgia,serif;fill:#E8EEE9}.m{font:12px "DejaVu Sans Mono",monospace;fill:#7C9288;letter-spacing:2px}.s{font:14px "DejaVu Sans Mono",monospace;fill:#9EB1A8}.p{fill:none;stroke:#2EC4B6;stroke-width:3;stroke-dasharray:12 9;stroke-linecap:round;animation:flow 4s linear infinite}.orange{stroke:#E8762E}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.25;transform:scale(.72)}}
</style>
</defs>
<rect width="1400" height="470" rx="28" class="bg"/>
<text x="42" y="40" class="m">SENTINEL LAKEHOUSE / ARCHITECTURE IN MOTION</text>
<text x="42" y="76" class="h">The happy path is only the beginning.</text>
<text x="42" y="104" class="s">ingest → validate → shape → serve, with explicit failure and observability paths</text>
<g transform="translate(42 140)">
<rect width="270" height="132" rx="20" class="panel"/><text x="24" y="34" class="m">01 / BRONZE</text><text x="24" y="68" class="h">INGEST</text><text x="24" y="100" class="s">Auto Loader · CDC</text><circle cx="238" cy="32" r="6" fill="#2EC4B6" class="pulse"/>
<rect x="370" width="270" height="132" rx="20" class="panel"/><text x="394" y="34" class="m">02 / QUALITY</text><text x="394" y="68" class="h">GUARD</text><text x="394" y="100" class="s">validate · quarantine</text><circle cx="608" cy="32" r="6" fill="#E8762E" class="pulse"/>
<rect x="740" width="270" height="132" rx="20" class="panel"/><text x="764" y="34" class="m">03 / SILVER</text><text x="764" y="68" class="h">SHAPE</text><text x="764" y="100" class="s">dedupe · SCD · CDF</text><circle cx="978" cy="32" r="6" fill="#2EC4B6" class="pulse"/>
<rect x="1110" width="270" height="132" rx="20" class="panel"/><text x="1134" y="34" class="m">04 / GOLD</text><text x="1134" y="68" class="h">SERVE</text><text x="1134" y="100" class="s">marts · BI · analytics</text><circle cx="1348" cy="32" r="6" fill="#E8762E" class="pulse"/>
<path d="M270 66H370 M640 66H740 M1010 66H1110" class="p"/>
<circle cx="145" cy="66" r="7" fill="#E8762E" class="pulse"/><circle cx="517" cy="66" r="7" fill="#2EC4B6" class="pulse"/><circle cx="892" cy="66" r="7" fill="#E8762E" class="pulse"/>
<rect x="370" y="184" width="270" height="104" rx="18" class="panel"/><text x="394" y="217" class="m">FAILURE PATH</text><text x="394" y="248" class="h">QUARANTINE</text><text x="394" y="276" class="s">bad data stays visible</text>
<rect x="740" y="184" width="270" height="104" rx="18" class="panel"/><text x="764" y="217" class="m">OBSERVABILITY</text><text x="764" y="248" class="h">MEASURE</text><text x="764" y="276" class="s">quality · latency · cost</text>
<path d="M505 132V184" class="p orange"/><path d="M875 132V184" class="p"/>
</g>
<text x="42" y="432" class="m">DATA QUALITY · CDC · SCD1/SCD2 · GOVERNANCE · PERFORMANCE TRADE-OFFS</text>
</svg>