<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#0A1C18" />
      <stop offset="100%" stop-color="#06100E" />
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5EC8FF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="traj-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" />
      <stop offset="35%" stop-color="#5EC8FF" />
      <stop offset="70%" stop-color="#FF9B4A" />
      <stop offset="100%" stop-color="#FFC085" />
    </linearGradient>

    <radialGradient id="ambient-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#06100E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orange-glow" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#06100E" stop-opacity="0" />
    </radialGradient>

    <!-- Patterns -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#2EE6A7" fill-opacity="0.3" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.15); }
      }
      @keyframes floatParticle1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(15px, -18px); opacity: 0.7; }
      }
      @keyframes floatParticle2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(-20px, 12px); opacity: 0.85; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconRing {
        0% { r: 4; opacity: 0.9; }
        100% { r: 18; opacity: 0; }
      }
      .p1 { animation: floatParticle1 6s ease-in-out infinite; }
      .p2 { animation: floatParticle2 8s ease-in-out infinite; }
      .p3 { animation: floatParticle1 7s ease-in-out infinite 2s; }
      .flow-line { stroke-dasharray: 8 6; animation: flowDash 5s linear infinite; }
      .beacon { animation: beaconRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="960" height="360" fill="url(#ambient-glow)" rx="16" />
  <rect width="960" height="360" fill="url(#orange-glow)" rx="16" />
  <rect width="960" height="360" fill="url(#grid)" rx="16" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="958" height="358" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="344" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Corner Ticks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.75" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.75" />
  <path d="M 16 332 L 16 344 L 28 344" fill="none" stroke="#2EE6A7" stroke-width="1.75" />
  <path d="M 944 332 L 944 344 L 932 344" fill="none" stroke="#2EE6A7" stroke-width="1.75" />

  <!-- Floating Particles -->
  <g>
    <circle cx="120" cy="80" r="2" fill="#2EE6A7" class="p1" />
    <circle cx="280" cy="140" r="1.5" fill="#5EC8FF" class="p2" />
    <circle cx="420" cy="70" r="2.5" fill="#2EE6A7" class="p3" />
    <circle cx="680" cy="110" r="2" fill="#FF9B4A" class="p1" />
    <circle cx="840" cy="90" r="1.5" fill="#5EC8FF" class="p2" />
    <circle cx="160" cy="260" r="2" fill="#FF9B4A" class="p3" />
    <circle cx="780" cy="270" r="2.5" fill="#2EE6A7" class="p1" />
    <circle cx="890" cy="210" r="1.5" fill="#FFC085" class="p2" />
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(40, 42)">
    <!-- Status Beacon -->
    <circle cx="0" cy="0" r="4" fill="#2EE6A7" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="#2EE6A7" class="beacon" />
    <text x="14" y="4" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.8">SYSTEM STATUS // PRODUCTION ACTIVE</text>
    
    <!-- Coordinate Metadata -->
    <text x="880" y="4" text-anchor="end" fill="#91A8A2" font-size="11" font-family="monospace" letter-spacing="1.2">LAT: 37.7749° N · LON: 122.4194° W · STACK: L4/DIST</text>
  </g>

  <!-- Divider Rule -->
  <line x1="40" y1="62" x2="920" y2="62" stroke="#17352F" stroke-width="1" />

  <!-- Main Hero Title & Identity -->
  <g transform="translate(40, 128)">
    <text x="0" y="0" fill="#EAF4F0" font-size="44" font-weight="800" letter-spacing="2.5">MANSI DHRUV</text>
    
    <g transform="translate(0, 36)">
      <rect x="0" y="-18" width="410" height="28" rx="6" fill="#0A1715" stroke="#17352F" stroke-width="1" />
      <text x="12" y="1" fill="#2EE6A7" font-size="14" font-weight="600" letter-spacing="1.2">Lead Data Engineer · Solution Architect</text>
    </g>

    <!-- Key Metrics Pill Group -->
    <g transform="translate(0, 78)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="148" height="26" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#2EE6A7" />
        <text x="24" y="17" fill="#EAF4F0" font-size="11" font-weight="600" letter-spacing="0.5">7+ Years Experience</text>
      </g>
      
      <g transform="translate(158, 0)">
        <rect x="0" y="0" width="138" height="26" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#5EC8FF" />
        <text x="24" y="17" fill="#EAF4F0" font-size="11" font-weight="600" letter-spacing="0.5">Master's Degree</text>
      </g>

      <g transform="translate(306, 0)">
        <rect x="0" y="0" width="168" height="26" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="1" />
        <circle cx="12" cy="13" r="3" fill="#FF9B4A" />
        <text x="24" y="17" fill="#EAF4F0" font-size="11" font-weight="600" letter-spacing="0.5">Systems Architecture</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Interactive Geometric Lab Constellation -->
  <g transform="translate(680, 150)">
    <!-- Concentric Target Geometry -->
    <circle cx="120" cy="0" r="90" fill="none" stroke="#17352F" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="120" cy="0" r="60" fill="none" stroke="#17352F" stroke-width="1" />
    <circle cx="120" cy="0" r="30" fill="none" stroke="#2EE6A7" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Crosshair axes -->
    <line x1="20" y1="0" x2="220" y2="0" stroke="#17352F" stroke-width="1" />
    <line x1="120" y1="-100" x2="120" y2="100" stroke="#17352F" stroke-width="1" />

    <!-- Trajectory nodes in orbit -->
    <circle cx="60" cy="-45" r="4" fill="#2EE6A7" />
    <text x="50" y="-55" fill="#91A8A2" font-size="9" font-family="monospace">AWS/SPARK</text>

    <circle cx="180" cy="-30" r="4" fill="#5EC8FF" />
    <text x="175" y="-40" fill="#91A8A2" font-size="9" font-family="monospace">DATABRICKS</text>

    <circle cx="160" cy="50" r="4" fill="#FF9B4A" />
    <text x="155" y="66" fill="#91A8A2" font-size="9" font-family="monospace">CUDA/RAPIDS</text>

    <circle cx="70" cy="40" r="4" fill="#2EE6A7" />
    <text x="35" y="55" fill="#91A8A2" font-size="9" font-family="monospace">LAKEHOUSE</text>

    <!-- Core Center Signal -->
    <circle cx="120" cy="0" r="6" fill="#2EE6A7" />
    <circle cx="120" cy="0" r="12" fill="none" stroke="#2EE6A7" stroke-width="1" class="beacon" />
  </g>

  <!-- Bottom Trajectory Ribbon -->
  <g transform="translate(40, 275)">
    <!-- Container Panel -->
    <rect x="0" y="0" width="880" height="54" rx="8" fill="#071614" stroke="#17352F" stroke-width="1" />
    
    <!-- Flow Connector Line -->
    <line x1="180" y1="27" x2="840" y2="27" stroke="#17352F" stroke-width="2" />
    <line x1="180" y1="27" x2="840" y2="27" stroke="url(#traj-grad)" stroke-width="2" class="flow-line" />

    <!-- Trajectory Title Label -->
    <text x="16" y="22" fill="#91A8A2" font-size="10" font-weight="700" letter-spacing="1.2">TRAJECTORY</text>
    <text x="16" y="38" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1">ARC</text>

    <!-- Step 1 -->
    <g transform="translate(180, 27)">
      <circle cx="0" cy="0" r="6" fill="#2EE6A7" />
      <circle cx="0" cy="0" r="2.5" fill="#06100E" />
      <text x="0" y="-14" text-anchor="middle" fill="#EAF4F0" font-size="11" font-weight="700" letter-spacing="0.5">Data Platforms</text>
      <text x="0" y="18" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">AWS · Lakehouses</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(400, 27)">
      <circle cx="0" cy="0" r="6" fill="#5EC8FF" />
      <circle cx="0" cy="0" r="2.5" fill="#06100E" />
      <text x="0" y="-14" text-anchor="middle" fill="#EAF4F0" font-size="11" font-weight="700" letter-spacing="0.5">Distributed Systems</text>
      <text x="0" y="18" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">Spark · Partitioning</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(620, 27)">
      <circle cx="0" cy="0" r="6" fill="#FF9B4A" />
      <circle cx="0" cy="0" r="2.5" fill="#06100E" />
      <text x="0" y="-14" text-anchor="middle" fill="#EAF4F0" font-size="11" font-weight="700" letter-spacing="0.5">Performance</text>
      <text x="0" y="18" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">Query &amp; Memory Tuning</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(830, 27)">
      <circle cx="0" cy="0" r="7" fill="#FFC085" stroke="#FF9B4A" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#06100E" />
      <text x="0" y="-14" text-anchor="middle" fill="#FFC085" font-size="11" font-weight="700" letter-spacing="0.5">Accelerated Systems</text>
      <text x="0" y="18" text-anchor="middle" fill="#91A8A2" font-size="9" font-family="monospace">CUDA · RAPIDS GPU</text>
    </g>
  </g>
</svg>
