  <path d="M95 292 C170 315 270 320 365 312" class="line dash" stroke="#2E63D7" stroke-width="4"/>
  <circle cx="104" cy="294" r="7" fill="#E8762E" class="pulse"/>
  <circle cx="438" cy="304" r="7" fill="#2E63D7" class="pulse"/>
  <circle cx="530" cy="260" r="7" fill="#E8762E" class="pulse"/>
</g>
