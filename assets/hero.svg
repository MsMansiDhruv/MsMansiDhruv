<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4EC"/><stop offset="0.55" stop-color="#FAF8F2"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E63D7"/><stop offset="1" stop-color="#7EA8EA"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .grid{stroke:#8A9096;stroke-opacity:.16;stroke-width:1}
    .mono{font:14px "DejaVu Sans Mono",monospace;letter-spacing:2px;fill:#6E7378}
    .serif{font:700 62px Georgia,serif;fill:#161A1D}
    .small{font:15px "DejaVu Sans Mono",monospace;fill:#60666B}
    .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .float{animation:float 4.5s ease-in-out infinite}
    .dash{stroke-dasharray:12 10;animation:dash 3.5s linear infinite}
    .blink{animation:blink 1.6s steps(2,end) infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes dash{to{stroke-dashoffset:-120}}
    @keyframes blink{50%{opacity:0}}
  </style>
</defs>
<rect width="1400" height="520" fill="url(#bg)"/>
<g class="grid">
  <path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400"/>
  <path d="M80 0V520M180 0V520M280 0V520M380 0V520M480 0V520M580 0V520M680 0V520M780 0V520M880 0V520M980 0V520M1080 0V520M1180 0V520M1280 0V520"/>
</g>
