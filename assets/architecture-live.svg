<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460">
<style>
.bg{fill:#090D0B}.p{fill:#0F1713;stroke:#2EC4B6;stroke-opacity:.2}.m{font:12px "DejaVu Sans Mono",monospace;fill:#7E9489;letter-spacing:2px}.h{font:700 28px Georgia,serif;fill:#E8EEE9}.s{font:14px "DejaVu Sans Mono",monospace;fill:#9AAEA5}.flow{fill:none;stroke:#2EC4B6;stroke-width:3;stroke-dasharray:12 9;animation:flow 3.5s linear infinite}.hot{stroke:#E8762E}.node{animation:pulse 1.8s ease-in-out infinite}.packet{animation:move 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-105}}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}@keyframes move{0%{transform:translateX(0);opacity:0}10%{opacity:1}88%{opacity:1}100%{transform:translateX(1110px);opacity:0}}
</style>
<rect width="1400" height="460" rx="28" class="bg"/>
<text x="42" y="42" class="m">SENTINEL LAKEHOUSE / ARCHITECTURE IN MOTION</text>
<text x="42" y="80" class="h">Raw → Clean → Reliable → Useful</text>
<text x="42" y="108" class="s">incremental ingestion, quality gates, CDC, dimensional models, observability</text>
<g transform="translate(42 145)">
<rect width="270" height="125" rx="20" class="p"/><text x="24" y="34" class="m">01 / BRONZE</text><text x="24" y="69" class="h">INGEST</text><text x="24" y="98" class="s">Auto Loader · CDC</text>
<rect x="370" width="270" height="125" rx="20" class="p"/><text x="394" y="34" class="m">02 / QUALITY</text><text x="394" y="69" class="h">GUARD</text><text x="394" y="98" class="s">validate · quarantine</text>
<rect x="740" width="270" height="125" rx="20" class="p"/><text x="764" y="34" class="m">03 / SILVER</text><text x="764" y="69" class="h">SHAPE</text><text x="764" y="98" class="s">dedupe · SCD · CDF</text>
<rect x="1110" width="270" height="125" rx="20" class="p"/><text x="1134" y="34" class="m">04 / GOLD</text><text x="1134" y="69" class="h">SERVE</text><text x="1134" y="98" class="s">marts · BI · analytics</text>
<path d="M270 62H370 M640 62H740 M1010 62H1110" class="flow"/>
<circle cx="145" cy="62" r="7" fill="#E8762E" class="packet"/><circle cx="515" cy="62" r="7" fill="#2EC4B6" class="packet" style="animation-delay:-1.3s"/><circle cx="888" cy="62" r="7" fill="#E8762E" class="packet" style="animation-delay:-2.3s"/>
<rect x="370" y="170" width="270" height="95" rx="18" class="p"/><text x="394" y="201" class="m">FAILURE PATH</text><text x="394" y="232" class="h">QUARANTINE</text><text x="394" y="256" class="s">bad data stays visible</text>
<rect x="740" y="170" width="270" height="95" rx="18" class="p"/><text x="764" y="201" class="m">OBSERVABILITY</text><text x="764" y="232" class="h">MEASURE</text><text x="764" y="256" class="s">quality · latency · cost</text>
<path d="M505 125V170" class="flow hot"/><path d="M875 125V170" class="flow"/>
</g>
<text x="42" y="430" class="m">DATA QUALITY · GOVERNANCE · PERFORMANCE TRADE-OFFS</text>
</svg>