<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260">
<style>
.bg{fill:#0B100E}.m{font:12px "DejaVu Sans Mono",monospace;fill:#8AA299;letter-spacing:1.5px}.t{font:14px "DejaVu Sans Mono",monospace;fill:#E8EEE9}.s{font:12px "DejaVu Sans Mono",monospace;fill:#71837A}.o{fill:#E8762E}.g{fill:#2EC4B6}.line{stroke:#2EC4B6;stroke-opacity:.22;stroke-width:2}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.65)}}
</style>
<rect width="960" height="260" rx="26" class="bg"/><rect x=".5" y=".5" width="959" height="259" rx="25" fill="none" stroke="#2EC4B6" stroke-opacity=".16"/>
<text x="34" y="34" class="m">mansi@github ~ $ ./activity.sh</text>
<text x="34" y="64" class="s">recent public work / generated from GitHub events</text>
<line x1="52" y1="95" x2="52" y2="220" class="line"/>
<!-- recent event rows generated by workflow -->
<g id="events">
<circle cx="52" cy="106" r="6" class="o pulse"/><text x="76" y="111" class="t">activity feed initializing</text><text x="76" y="131" class="s">the next refresh will replace this row with real events</text>
</g>
<text x="34" y="242" class="m">PUSH · PR · ISSUE · CREATE · DISCUSSION</text>
</svg>