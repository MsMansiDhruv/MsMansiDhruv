<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290">
<style>
.bg{fill:#0B100E}.m{font:12px "DejaVu Sans Mono",monospace;fill:#8AA299;letter-spacing:1.5px}.t{font:13px "DejaVu Sans Mono",monospace;fill:#E8EEE9}.s{font:12px "DejaVu Sans Mono",monospace;fill:#71837A}.o{fill:#E8762E}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.28;transform:scale(.62)}}
</style>
