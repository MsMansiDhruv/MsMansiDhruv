<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#081815" />
      <stop offset="100%" stop-color="#06100E" />
    </linearGradient>

    <!-- Mesh Line Gradient X -->
    <linearGradient id="terrain-x-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EC8FF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#2EE6A7" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#FF9B4A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFC085" stop-opacity="0.9" />
    </linearGradient>

    <!-- Mesh Line Gradient Y -->
    <linearGradient id="terrain-y-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EC8FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#2EE6A7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF9B4A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Surface Fill Gradient -->
    <linearGradient id="surface-fill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0A1E1A" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#123B32" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9B4A" stop-opacity="0.15" />
    </linearGradient>

    <!-- Radial Spotlights -->
    <radialGradient id="mesh-glow" cx="60%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#2EE6A7" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#06100E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="peak-glow" cx="72%" cy="32%" r="25%">
      <stop offset="0%" stop-color="#FF9B4A" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#06100E" stop-opacity="0" />
    </radialGradient>

    <!-- Animation Styles -->
    <style>
      @keyframes scanElevation {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 0.95; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radarPulse {
        0% { r: 2; opacity: 1; }
        100% { r: 14; opacity: 0; }
      }
      @keyframes waveSway {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .scan-line {
        stroke-dasharray: 80 400;
        animation: scanElevation 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .beacon-ring {
        animation: radarPulse 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .sway-layer {
        animation: waveSway 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="460" fill="url(#bg)" rx="16" />
  <rect width="960" height="460" fill="url(#mesh-glow)" rx="16" />
  <rect width="960" height="460" fill="url(#peak-glow)" rx="16" />

  <!-- Frame & Technical Borders -->
  <rect x="1" y="1" width="958" height="458" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="444" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Corner Crosshairs -->
  <path d="M 18 30 L 18 18 L 30 18" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 942 30 L 942 18 L 930 18" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 18 430 L 18 442 L 30 442" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 942 430 L 942 442 L 930 442" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Header HUD Strip -->
  <g transform="translate(36, 38)">
    <circle cx="4" cy="4" r="3" fill="#2EE6A7" />
    <text x="16" y="8" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.5">3D SYSTEM TOPOGRAPHY // COMPUTE &amp; SCALE SURFACE</text>
    
    <text x="888" y="8" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">SURFACE RES: 64x64 · ELEVATION: EXECUTION DEPTH · ISO: 35.264°</text>
  </g>
  <line x1="36" y1="56" x2="924" y2="56" stroke="#17352F" stroke-width="1" />

  <!-- 3D Coordinate Axis Guides -->
  <g transform="translate(100, 360)">
    <!-- X-Axis (Scale & Throughput) -->
    <line x1="0" y1="0" x2="380" y2="45" stroke="#17352F" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="390" y="52" fill="#91A8A2" font-size="10" font-family="monospace" font-weight="600">X: SCALE / WORKLOAD (TB/DAY)</text>

    <!-- Y-Axis (Compute & Memory Intensity) -->
    <line x1="0" y1="0" x2="480" y2="-120" stroke="#17352F" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="490" y="-125" fill="#91A8A2" font-size="10" font-family="monospace" font-weight="600">Y: MEMORY &amp; SHUFFLE LOAD</text>

    <!-- Z-Axis (Optimization & Latency Gain) -->
    <line x1="0" y1="0" x2="0" y2="-250" stroke="#17352F" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="-5" y="-260" fill="#2EE6A7" font-size="10" font-family="monospace" font-weight="700">Z: ENGINE OPTIMIZATION EFFICIENCY</text>
  </g>

  <!-- 3D Surface Mesh (Isometric Wireframe Terrain) -->
  <g class="sway-layer" transform="translate(60, 20)">

    <!-- Base Under-Mesh Shading polygons -->
    <polygon points="
      140,340 240,320 380,310 520,315 660,330 800,345
      780,260 620,230 480,220 340,240 220,270 140,340"
      fill="url(#surface-fill)" />

    <!-- Isometric Longitudinal Curves (X-Direction Strands) -->
    <!-- Line 1 (Foreground low baseline) -->
    <path d="M 120 350 Q 240 345 360 335 T 600 330 T 840 355" fill="none" stroke="#17352F" stroke-width="1" />

    <!-- Line 2 -->
    <path d="M 135 330 Q 255 315 385 295 T 630 300 T 825 335" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.2" />

    <!-- Line 3 -->
    <path d="M 150 305 Q 280 280 410 255 T 660 265 T 810 310" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.3" />

    <!-- Line 4 (Mid elevation) -->
    <path d="M 170 275 Q 310 235 440 210 T 680 225 T 790 285" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.4" />

    <!-- Line 5 (Rising ridge) -->
    <path d="M 190 240 Q 330 185 470 160 T 710 180 T 780 255" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.5" />

    <!-- Line 6 (High Ridge & Primary Peak) -->
    <path d="M 215 205 Q 360 135 505 115 T 730 145 T 765 220" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.8" />
    <path d="M 215 205 Q 360 135 505 115 T 730 145 T 765 220" fill="none" stroke="#2EE6A7" stroke-width="2.5" class="scan-line" />

    <!-- Line 7 (Peak Crests) -->
    <path d="M 245 170 Q 390 95 535 85 T 745 115 T 755 185" fill="none" stroke="url(#terrain-x-grad)" stroke-width="2" />
    <path d="M 245 170 Q 390 95 535 85 T 745 115 T 755 185" fill="none" stroke="#FF9B4A" stroke-width="3" class="scan-line" />

    <!-- Line 8 (Upper Plateau) -->
    <path d="M 280 140 Q 420 75 565 65 T 740 95 T 740 150" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.6" />

    <!-- Line 9 (Summit Spine) -->
    <path d="M 320 115 Q 460 60 590 55 T 725 80 T 710 120" fill="none" stroke="url(#terrain-x-grad)" stroke-width="1.4" />

    <!-- Transverse Ribs (Cross-Mesh Y-Direction Strands) -->
    <path d="M 120 350 L 320 115" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 180 340 L 370 98" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" />
    <path d="M 240 325 L 420 84" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" />
    <path d="M 300 310 L 470 72" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.2" />
    <path d="M 370 295 L 520 62" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.4" />
    <path d="M 440 280 L 570 58" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.5" />
    <path d="M 510 270 L 620 58" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.5" />
    <path d="M 580 268 L 665 65" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.4" />
    <path d="M 650 275 L 705 78" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1.2" />
    <path d="M 720 295 L 730 100" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" />
    <path d="M 780 325 L 735 130" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" stroke-dasharray="2 2" />
    <path d="M 840 355 L 710 120" fill="none" stroke="url(#terrain-y-grad)" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Data Callout Markers on the 3D Topography -->
    <!-- Marker 1: Peak Compute Optimization -->
    <g transform="translate(535, 85)">
      <circle cx="0" cy="0" r="4" fill="#FF9B4A" />
      <circle cx="0" cy="0" r="4" fill="none" stroke="#FF9B4A" stroke-width="1" class="beacon-ring" />
      
      <!-- Leader Line -->
      <polyline points="0,-4 0,-30 40,-30" fill="none" stroke="#FF9B4A" stroke-width="1.2" />
      <rect x="44" y="-42" width="200" height="24" rx="4" fill="#0A1715" stroke="#FF9B4A" stroke-width="1" />
      <text x="52" y="-26" fill="#FFC085" font-size="10" font-weight="700" letter-spacing="0.8">OPTIMAL SHUFFLE &amp; PARTITIONING</text>
    </g>

    <!-- Marker 2: Acceleration Frontier -->
    <g transform="translate(680, 150)">
      <circle cx="0" cy="0" r="3.5" fill="#2EE6A7" />
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="#2EE6A7" stroke-width="1" class="beacon-ring" />
      
      <polyline points="0,-4 0,-25 35,-25" fill="none" stroke="#2EE6A7" stroke-width="1.2" />
      <rect x="39" y="-37" width="180" height="24" rx="4" fill="#0A1715" stroke="#2EE6A7" stroke-width="1" />
      <text x="47" y="-21" fill="#2EE6A7" font-size="10" font-weight="700" letter-spacing="0.8">GPU / CUDA VECTOR REGION</text>
    </g>

    <!-- Marker 3: Distributed Storage Floor -->
    <g transform="translate(255, 315)">
      <circle cx="0" cy="0" r="3.5" fill="#5EC8FF" />
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="#5EC8FF" stroke-width="1" class="beacon-ring" />
      
      <polyline points="0,4 0,25 -30,25" fill="none" stroke="#5EC8FF" stroke-width="1.2" />
      <rect x="-195" y="13" width="160" height="24" rx="4" fill="#0A1715" stroke="#5EC8FF" stroke-width="1" />
      <text x="-187" y="29" fill="#5EC8FF" font-size="10" font-weight="700" letter-spacing="0.8">LAKEHOUSE DELTA BASE</text>
    </g>
  </g>

  <!-- Bottom Insight Banner -->
  <g transform="translate(36, 400)">
    <rect x="0" y="0" width="888" height="38" rx="6" fill="#0A1715" stroke="#17352F" stroke-width="1" />
    <circle cx="16" cy="19" r="3" fill="#2EE6A7" />
    <text x="30" y="23" fill="#EAF4F0" font-size="11" font-weight="600" letter-spacing="0.6">ENGINEERING PRINCIPLE:</text>
    <text x="195" y="23" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="0.6">"I Measure Before I Scale — The Interesting Part Is What The Engine Is Doing Underneath."</text>
  </g>
</svg>
