<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#091916" />
      <stop offset="100%" stop-color="#06100E" />
    </linearGradient>

    <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143029" />
      <stop offset="100%" stop-color="#0A1E1A" />
    </linearGradient>

    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11333F" />
      <stop offset="100%" stop-color="#0B1F27" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2914" />
      <stop offset="100%" stop-color="#23170B" />
    </linearGradient>

    <linearGradient id="accent-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" />
      <stop offset="50%" stop-color="#5EC8FF" />
      <stop offset="100%" stop-color="#FF9B4A" />
    </linearGradient>

    <style>
      @keyframes pipePulse {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      .pipe-flow {
        stroke-dasharray: 8 6;
        animation: pipePulse 4s linear infinite;
      }
      .alert-pulse {
        animation: pipePulse 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="960" height="480" fill="url(#sen-bg)" rx="16" />
  
  <!-- Frame Borders -->
  <rect x="1" y="1" width="958" height="478" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="464" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Corner Ticks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 16 452 L 16 464 L 28 464" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 452 L 944 464 L 932 464" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Top Title Strip -->
  <g transform="translate(36, 38)">
    <circle cx="4" cy="4" r="3" fill="#2EE6A7" />
    <text x="16" y="8" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.5">FLAGSHIP ARCHITECTURE // SENTINEL MEDALLION LAKEHOUSE</text>
    <text x="888" y="8" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">REPO: MsMansiDhruv/sentinel-lakehouse · UNITY CATALOG</text>
  </g>
  <line x1="36" y1="56" x2="924" y2="56" stroke="#17352F" stroke-width="1" />

  <!-- Architecture Flow Columns -->
  <!-- 1. INGESTION COLUMN -->
  <g transform="translate(36, 80)">
    <rect x="0" y="0" width="160" height="270" rx="8" fill="#0A1715" stroke="#17352F" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#0B1D1A" />
    <text x="12" y="18" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="0.8">01. INGESTION</text>

    <!-- Sub-cards -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Auto Loader</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">CloudFiles Stream</text>
    </g>

    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Schema Evolution</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">addNewColumns / JSON</text>
    </g>

    <g transform="translate(10, 154)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Audit Metadata</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">_ingest_timestamp</text>
    </g>

    <g transform="translate(10, 210)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Declarative Pipe</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">Lakeflow / DLT DAG</text>
    </g>
  </g>

  <!-- Arrow Ingestion -> Bronze -->
  <line x1="196" y1="215" x2="224" y2="215" stroke="url(#accent-stream)" stroke-width="2.5" class="pipe-flow" />

  <!-- 2. BRONZE LAYER -->
  <g transform="translate(224, 80)">
    <rect x="0" y="0" width="150" height="270" rx="8" fill="url(#bronze-grad)" stroke="#2EE6A7" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#143029" />
    <text x="12" y="18" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="0.8">02. BRONZE DELTA</text>

    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="130" height="60" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#2EE6A7" font-size="10" font-weight="700">Raw Append-Only</text>
      <text x="10" y="34" fill="#EAF4F0" font-size="8.5" font-family="monospace">Delta Lake Format</text>
      <text x="10" y="48" fill="#91A8A2" font-size="8" font-family="monospace">ACID Transactions</text>
    </g>

    <g transform="translate(10, 112)">
      <rect x="0" y="0" width="130" height="60" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#2EE6A7" font-size="10" font-weight="700">Change Data Feed</text>
      <text x="10" y="34" fill="#EAF4F0" font-size="8.5" font-family="monospace">table.enableCDF</text>
      <text x="10" y="48" fill="#91A8A2" font-size="8" font-family="monospace">Row-Level History</text>
    </g>

    <g transform="translate(10, 182)">
      <rect x="0" y="0" width="130" height="76" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#2EE6A7" font-size="10" font-weight="700">Integrity Gate</text>
      <text x="10" y="34" fill="#EAF4F0" font-size="8.5" font-family="monospace">Expectations Rules</text>
      <text x="10" y="48" fill="#5EC8FF" font-size="8" font-family="monospace">→ Pass to Silver</text>
      <text x="10" y="62" fill="#FF9B4A" font-size="8" font-family="monospace">⚠ Quarantine Fail</text>
    </g>
  </g>

  <!-- Connectors to Silver and Quarantine -->
  <line x1="374" y1="160" x2="404" y2="160" stroke="#5EC8FF" stroke-width="2.5" class="pipe-flow" />
  <path d="M 374 270 C 390 270, 390 320, 404 320" fill="none" stroke="#FF9B4A" stroke-width="2" class="alert-pulse" stroke-dasharray="4 4" />

  <!-- 3. SILVER & QUARANTINE -->
  <g transform="translate(404, 80)">
    <!-- Silver Container -->
    <rect x="0" y="0" width="160" height="175" rx="8" fill="url(#silver-grad)" stroke="#5EC8FF" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#11333F" />
    <text x="12" y="18" fill="#5EC8FF" font-size="11" font-weight="700" letter-spacing="0.8">03. SILVER CLEAN</text>

    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="140" height="54" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#5EC8FF" font-size="10" font-weight="700">CDC &amp; MERGE</text>
      <text x="10" y="33" fill="#EAF4F0" font-size="8.5" font-family="monospace">SCD Type 1 (Upsert)</text>
      <text x="10" y="46" fill="#91A8A2" font-size="8" font-family="monospace">SCD Type 2 (History)</text>
    </g>

    <g transform="translate(10, 102)">
      <rect x="0" y="0" width="140" height="60" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#5EC8FF" font-size="10" font-weight="700">Standardized Schema</text>
      <text x="10" y="33" fill="#EAF4F0" font-size="8.5" font-family="monospace">Deduplicated Entities</text>
      <text x="10" y="47" fill="#91A8A2" font-size="8" font-family="monospace">Data Quality Validated</text>
    </g>

    <!-- Quarantine Dead-Letter Box -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="160" height="80" rx="8" fill="#0A1715" stroke="#FF9B4A" stroke-width="1.2" />
      <rect x="0" y="0" width="160" height="24" rx="8" fill="#23170B" />
      <text x="10" y="16" fill="#FF9B4A" font-size="10" font-weight="700">QUARANTINE / DEAD-LETTER</text>
      
      <text x="10" y="42" fill="#EAF4F0" font-size="8.5" font-family="monospace">Expectation Failures</text>
      <text x="10" y="56" fill="#91A8A2" font-size="8" font-family="monospace">Stored with Error Trace</text>
      <text x="10" y="70" fill="#FFC085" font-size="8" font-family="monospace">Alerting &amp; Reprocessing</text>
    </g>
  </g>

  <!-- Arrow Silver -> Gold -->
  <line x1="564" y1="160" x2="594" y2="160" stroke="url(#accent-stream)" stroke-width="2.5" class="pipe-flow" />

  <!-- 4. GOLD LAYER (ANALYTICS MARTS) -->
  <g transform="translate(594, 80)">
    <rect x="0" y="0" width="160" height="270" rx="8" fill="url(#gold-grad)" stroke="#FF9B4A" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#3D2914" />
    <text x="12" y="18" fill="#FFC085" font-size="11" font-weight="700" letter-spacing="0.8">04. GOLD MARTS</text>

    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="140" height="60" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#FFC085" font-size="10" font-weight="700">Dimensional Models</text>
      <text x="10" y="34" fill="#EAF4F0" font-size="8.5" font-family="monospace">Star Schema Facts/Dims</text>
      <text x="10" y="48" fill="#91A8A2" font-size="8" font-family="monospace">Aggregated Views</text>
    </g>

    <g transform="translate(10, 112)">
      <rect x="0" y="0" width="140" height="60" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#FFC085" font-size="10" font-weight="700">Liquid Clustering</text>
      <text x="10" y="34" fill="#2EE6A7" font-size="8.5" font-family="monospace">Z-Order &amp; Partitioning</text>
      <text x="10" y="48" fill="#91A8A2" font-size="8" font-family="monospace">Pruning &amp; Compaction</text>
    </g>

    <g transform="translate(10, 182)">
      <rect x="0" y="0" width="140" height="76" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#FFC085" font-size="10" font-weight="700">Serving &amp; APIs</text>
      <text x="10" y="34" fill="#EAF4F0" font-size="8.5" font-family="monospace">Databricks SQL</text>
      <text x="10" y="48" fill="#91A8A2" font-size="8" font-family="monospace">PowerBI / Tableau</text>
      <text x="10" y="62" fill="#91A8A2" font-size="8" font-family="monospace">Real-Time Endpoints</text>
    </g>
  </g>

  <!-- 5. GOVERNANCE & CI/CD BAR -->
  <g transform="translate(764, 80)">
    <rect x="0" y="0" width="160" height="270" rx="8" fill="#0A1715" stroke="#17352F" stroke-width="1.2" />
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#0B1D1A" />
    <text x="12" y="18" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="0.8">05. GOVERNANCE</text>

    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Unity Catalog</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">Lineage &amp; RBAC</text>
    </g>

    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">CI/CD Pipeline</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">GitHub Actions · pytest</text>
    </g>

    <g transform="translate(10, 154)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Observability</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">Latency &amp; SLA Monitors</text>
    </g>

    <g transform="translate(10, 210)">
      <rect x="0" y="0" width="140" height="48" rx="5" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="10" y="18" fill="#EAF4F0" font-size="10" font-weight="700">Infrastructure</text>
      <text x="10" y="34" fill="#91A8A2" font-size="8.5" font-family="monospace">Terraform &amp; AWS</text>
    </g>
  </g>

  <!-- Bottom Engineering Benchmark Callout -->
  <g transform="translate(36, 365)">
    <rect x="0" y="0" width="888" height="85" rx="8" fill="#081A16" stroke="#2EE6A7" stroke-width="1.2" />
    
    <!-- Left badge -->
    <rect x="16" y="16" width="180" height="24" rx="4" fill="#06100E" stroke="#FF9B4A" stroke-width="1" />
    <circle cx="28" cy="28" r="3.5" fill="#FF9B4A" />
    <text x="38" y="32" fill="#FFC085" font-size="10" font-weight="700" letter-spacing="0.5">BENCHMARKED RESULT</text>

    <!-- Content -->
    <text x="210" y="32" fill="#EAF4F0" font-size="12" font-weight="700">Clustering reduced bytes scanned by 24% — measured against runtime trade-offs for serverless compute.</text>
    
    <text x="18" y="62" fill="#91A8A2" font-size="10.5" font-family="monospace">
      ENGINEERING TRADEOFF: <tspan fill="#2EE6A7">I/O REDUCTION VS. RUNTIME LATENCY</tspan> · <tspan fill="#5EC8FF">OPTIMIZED FOR SCALE &amp; COST PREDICTABILITY</tspan>
    </text>
  </g>
</svg>
