<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="eng-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06100E" />
      <stop offset="50%" stop-color="#091815" />
      <stop offset="100%" stop-color="#06100E" />
    </linearGradient>

    <!-- Edge Gradients -->
    <linearGradient id="spark-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A7" />
      <stop offset="50%" stop-color="#5EC8FF" />
      <stop offset="100%" stop-color="#FF9B4A" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes enginePulse {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes coreBeacon {
        0% { r: 3; opacity: 1; }
        100% { r: 14; opacity: 0; }
      }
      .engine-ray {
        stroke-dasharray: 6 6;
        animation: enginePulse 3s linear infinite;
      }
      .core-pulse {
        animation: coreBeacon 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Frame Base -->
  <rect width="960" height="450" fill="url(#eng-bg)" rx="16" />
  <rect x="1" y="1" width="958" height="448" rx="15" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="434" rx="10" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.5" />

  <!-- Corner Ticks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 28 L 944 16 L 932 16" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 16 422 L 16 434 L 28 434" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 944 422 L 944 434 L 932 434" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Top Status Strip -->
  <g transform="translate(36, 36)">
    <circle cx="4" cy="4" r="3" fill="#2EE6A7" />
    <text x="16" y="8" fill="#2EE6A7" font-size="11" font-weight="700" letter-spacing="1.5">DISTRIBUTED EXECUTION TOPOLOGY // SPARK ENGINE INTERNALS &amp; GPU OFFLOAD</text>
    <text x="888" y="8" text-anchor="end" fill="#91A8A2" font-size="10" font-family="monospace">CATALYST · TUNGSTEN MEMORY · SHUFFLE EXCHANGE</text>
  </g>
  <line x1="36" y1="52" x2="924" y2="52" stroke="#17352F" stroke-width="1" />

  <!-- ================= SPARK ENGINE ARCHITECTURE GRAPH ================= -->

  <!-- Connectors / Execution Paths -->
  <g transform="translate(0, 10)">
    <!-- Driver to Catalyst & Optimizer -->
    <path d="M 170 150 L 220 150" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 170 150 L 220 150" fill="none" stroke="#2EE6A7" stroke-width="2.5" class="engine-ray" />

    <!-- Optimizer to Whole-Stage Codegen & Tungsten -->
    <path d="M 370 150 L 420 150" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 370 150 L 420 150" fill="none" stroke="#5EC8FF" stroke-width="2.5" class="engine-ray" />

    <!-- Tungsten to Shuffle Exchange Mesh -->
    <path d="M 570 150 L 620 150" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 570 150 L 620 150" fill="none" stroke="#5EC8FF" stroke-width="2.5" class="engine-ray" />

    <!-- Shuffle Mesh to Executor Workers (Fan out) -->
    <path d="M 740 150 C 770 150, 770 110, 800 110" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 740 150 C 770 150, 770 110, 800 110" fill="none" stroke="#FF9B4A" stroke-width="2.5" class="engine-ray" />

    <path d="M 740 150 C 770 150, 770 190, 800 190" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 740 150 C 770 150, 770 190, 800 190" fill="none" stroke="#FF9B4A" stroke-width="2.5" class="engine-ray" />

    <!-- GPU Accelerated Kernel Vector Branch (Lower Track) -->
    <path d="M 495 210 C 495 280, 540 310, 620 310" fill="none" stroke="#17352F" stroke-width="2" />
    <path d="M 495 210 C 495 280, 540 310, 620 310" fill="none" stroke="url(#spark-edge)" stroke-width="2.5" class="engine-ray" />
    
    <path d="M 740 310 L 800 310" fill="none" stroke="#FF5C5C" stroke-width="2.5" class="engine-ray" />
  </g>

  <!-- Node 1: Spark Driver & Session Orchestrator -->
  <g transform="translate(36, 100)">
    <rect x="0" y="0" width="134" height="120" rx="8" fill="#0A1715" stroke="#2EE6A7" stroke-width="1.2" />
    <rect x="0" y="0" width="134" height="24" rx="8" fill="#0B1D1A" />
    <text x="10" y="16" fill="#2EE6A7" font-size="10" font-weight="700">01. SPARK DRIVER</text>
    
    <text x="10" y="42" fill="#EAF4F0" font-size="9.5" font-weight="700">SparkSession</text>
    <text x="10" y="58" fill="#91A8A2" font-size="8.5" font-family="monospace">Logical Analysis</text>
    <text x="10" y="74" fill="#91A8A2" font-size="8.5" font-family="monospace">DAGScheduler</text>
    <text x="10" y="90" fill="#91A8A2" font-size="8.5" font-family="monospace">TaskSet Partitioning</text>
    <text x="10" y="106" fill="#2EE6A7" font-size="8.5" font-family="monospace">Adaptive Query (AQE)</text>
  </g>

  <!-- Node 2: Catalyst Optimizer & Physical Planner -->
  <g transform="translate(220, 100)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#0B1D1A" stroke="#5EC8FF" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="24" rx="8" fill="#11333F" />
    <text x="10" y="16" fill="#5EC8FF" font-size="10" font-weight="700">02. CATALYST ENGINE</text>
    
    <text x="10" y="42" fill="#EAF4F0" font-size="9.5" font-weight="700">Rule-Based / Cost Optimizer</text>
    <text x="10" y="58" fill="#91A8A2" font-size="8.5" font-family="monospace">Predicate Pushdown</text>
    <text x="10" y="74" fill="#91A8A2" font-size="8.5" font-family="monospace">Column Pruning</text>
    <text x="10" y="90" fill="#91A8A2" font-size="8.5" font-family="monospace">Dynamic Partition Prune</text>
    <text x="10" y="106" fill="#5EC8FF" font-size="8.5" font-family="monospace">Broadcast Join Selection</text>
  </g>

  <!-- Node 3: Whole-Stage Codegen & Tungsten Memory -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#0A1715" stroke="#5EC8FF" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="24" rx="8" fill="#0B1D1A" />
    <text x="10" y="16" fill="#5EC8FF" font-size="10" font-weight="700">03. TUNGSTEN &amp; CODEGEN</text>
    
    <text x="10" y="42" fill="#EAF4F0" font-size="9.5" font-weight="700">Off-Heap Binary Format</text>
    <text x="10" y="58" fill="#91A8A2" font-size="8.5" font-family="monospace">Eliminates JVM GC Pause</text>
    <text x="10" y="74" fill="#91A8A2" font-size="8.5" font-family="monospace">Whole-Stage Java Bytecode</text>
    <text x="10" y="90" fill="#91A8A2" font-size="8.5" font-family="monospace">Cache-Aware Algorithms</text>
    <text x="10" y="106" fill="#FF9B4A" font-size="8.5" font-family="monospace">Zero-Copy Memory Alloc</text>
  </g>

  <!-- Node 4: Shuffle Exchange & Skew Resolver -->
  <g transform="translate(620, 100)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#0A1715" stroke="#FF9B4A" stroke-width="1.2" />
    <rect x="0" y="0" width="120" height="24" rx="8" fill="#23170B" />
    <text x="10" y="16" fill="#FFC085" font-size="10" font-weight="700">04. SHUFFLE MESH</text>
    
    <text x="10" y="42" fill="#FFC085" font-size="9.5" font-weight="700">Sort-Shuffle Mgr</text>
    <text x="10" y="58" fill="#91A8A2" font-size="8.5" font-family="monospace">Hash Partitioning</text>
    <text x="10" y="74" fill="#91A8A2" font-size="8.5" font-family="monospace">Skew Join Mitigator</text>
    <text x="10" y="90" fill="#91A8A2" font-size="8.5" font-family="monospace">Spill-to-Disk Min.</text>
    <text x="10" y="106" fill="#2EE6A7" font-size="8.5" font-family="monospace">Network Block I/O</text>
  </g>

  <!-- Node 5: Multi-Core Executor Workers -->
  <g transform="translate(800, 75)">
    <!-- Worker A -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="124" height="60" rx="6" fill="#0B1D1A" stroke="#2EE6A7" stroke-width="1" />
      <circle cx="12" cy="16" r="3.5" fill="#2EE6A7" />
      <circle cx="12" cy="16" r="3.5" fill="none" stroke="#2EE6A7" stroke-width="1" class="core-pulse" />
      <text x="22" y="20" fill="#2EE6A7" font-size="10" font-weight="700">EXECUTOR 01</text>
      <text x="10" y="38" fill="#EAF4F0" font-size="8.5" font-family="monospace">8 Tasks · In-Memory</text>
      <text x="10" y="50" fill="#91A8A2" font-size="8" font-family="monospace">Thread Pool Active</text>
    </g>

    <!-- Worker B -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="124" height="60" rx="6" fill="#0B1D1A" stroke="#2EE6A7" stroke-width="1" />
      <circle cx="12" cy="16" r="3.5" fill="#2EE6A7" />
      <text x="22" y="20" fill="#2EE6A7" font-size="10" font-weight="700">EXECUTOR 02</text>
      <text x="10" y="38" fill="#EAF4F0" font-size="8.5" font-family="monospace">8 Tasks · In-Memory</text>
      <text x="10" y="50" fill="#91A8A2" font-size="8" font-family="monospace">Thread Pool Active</text>
    </g>
  </g>

  <!-- Node 6: GPU Accelerated Vector Offload (RAPIDS / CUDA) -->
  <g transform="translate(620, 260)">
    <rect x="0" y="0" width="304" height="95" rx="8" fill="#081A16" stroke="#FF5C5C" stroke-width="1.5" />
    <rect x="0" y="0" width="304" height="26" rx="8" fill="#231210" />
    <circle cx="14" cy="13" r="3.5" fill="#FF5C5C" />
    <circle cx="14" cy="13" r="3.5" fill="none" stroke="#FF5C5C" stroke-width="1" class="core-pulse" />
    <text x="26" y="17" fill="#FF5C5C" font-size="10.5" font-weight="700" letter-spacing="0.5">GPU KERNEL OFFLOAD // NVIDIA RAPIDS &amp; CUDA</text>

    <text x="14" y="46" fill="#FFC085" font-size="9.5" font-weight="700">Columnar cuDF Execution &amp; High-Throughput GPU Shuffle</text>
    <text x="14" y="64" fill="#EAF4F0" font-size="8.5" font-family="monospace">Replaces JVM CPU loops with SIMD parallel GPU CUDA kernels.</text>
    <text x="14" y="80" fill="#2EE6A7" font-size="8.5" font-family="monospace">Trajectory: Zero-Copy PCIe / NVLink Data Streaming.</text>
  </g>

  <!-- Bottom Principle Banner -->
  <g transform="translate(36, 395)">
    <rect x="0" y="0" width="888" height="30" rx="6" fill="#071614" stroke="#17352F" stroke-width="1" />
    <text x="16" y="19" fill="#91A8A2" font-size="10" font-family="monospace">
      SYSTEMS PERSPECTIVE: <tspan fill="#2EE6A7">TUNING DISTRIBUTED ENGINES AT THE BYTE &amp; SHUFFLE LEVEL</tspan> · <tspan fill="#FF9B4A">MOVING TOWARD ACCELERATED GPU COMPUTE</tspan>
    </text>
  </g>
</svg>
