<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#06100E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C0A" />
      <stop offset="50%" stop-color="#081815" />
      <stop offset="100%" stop-color="#040C0A" />
    </linearGradient>

    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17352F" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#dot-grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="none" stroke="#17352F" stroke-width="1.5" />
  <rect x="28" y="28" width="1144" height="619" rx="8" fill="none" stroke="#17352F" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Corner Ticks -->
  <path d="M 36 48 L 36 36 L 48 36" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 1164 48 L 1164 36 L 1152 36" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 36 627 L 36 639 L 48 639" fill="none" stroke="#2EE6A7" stroke-width="1.5" />
  <path d="M 1164 627 L 1164 639 L 1152 639" fill="none" stroke="#2EE6A7" stroke-width="1.5" />

  <!-- Top Header Block -->
  <g transform="translate(60, 60)">
    <!-- Kicker Pill -->
    <rect x="0" y="0" width="280" height="26" rx="4" fill="#0B1D1A" stroke="#2EE6A7" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#2EE6A7" />
    <text x="24" y="17" fill="#2EE6A7" font-size="10.5" font-weight="700" letter-spacing="1.2">SENTINEL LAKEHOUSE // EVALUATION HARNESS</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#EAF4F0" font-size="30" font-weight="800" letter-spacing="0.5">Testing Text-to-SQL &amp; Databricks Genie in CI/CD</text>
    
    <!-- Subtitle -->
    <text x="0" y="85" fill="#91A8A2" font-size="14" font-weight="500">Why String Diffs Break on Valid Queries &amp; How AST Semantic Matching Makes Evaluation Deterministic</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="165" x2="1140" y2="165" stroke="#17352F" stroke-width="1" />

  <!-- ================= LEFT COLUMN: NAIVE STRING DIFF ================= -->
  <g transform="translate(60, 185)">
    <!-- Container Card -->
    <rect x="0" y="0" width="515" height="390" rx="10" fill="#0A1715" stroke="#FF5C5C" stroke-width="1" stroke-opacity="0.6" />
    <rect x="0" y="0" width="515" height="36" rx="10" fill="#1C0E0E" />
    
    <!-- Header -->
    <circle cx="20" cy="18" r="4" fill="#FF5C5C" />
    <text x="32" y="22" fill="#FF5C5C" font-size="12" font-weight="700" letter-spacing="0.8">NAIVE STRING DIFF // REGRESSION TESTING</text>
    <text x="495" y="22" text-anchor="end" fill="#FF5C5C" font-size="11" font-weight="700">FAILS REGULARLY</text>

    <!-- Code Block 1: Ground Truth -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#91A8A2" font-size="11" font-weight="700" letter-spacing="0.5">CURATED GOLD-STANDARD SQL:</text>
      <rect x="0" y="22" width="475" height="70" rx="6" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="14" y="44" fill="#EAF4F0" font-size="11" font-family="'Consolas', 'Courier New', monospace">SELECT customer_id, sum(amount) AS total</text>
      <text x="14" y="60" fill="#EAF4F0" font-size="11" font-family="'Consolas', 'Courier New', monospace">FROM orders WHERE status = 'DELIVERED' AND amount &gt; 100</text>
      <text x="14" y="76" fill="#EAF4F0" font-size="11" font-family="'Consolas', 'Courier New', monospace">GROUP BY customer_id</text>
    </g>

    <!-- Code Block 2: Generated SQL -->
    <g transform="translate(20, 155)">
      <text x="0" y="14" fill="#91A8A2" font-size="11" font-weight="700" letter-spacing="0.5">ENGINE-GENERATED SQL (LOGICALLY IDENTICAL):</text>
      <rect x="0" y="22" width="475" height="70" rx="6" fill="#06100E" stroke="#17352F" stroke-width="1" />
      <text x="14" y="44" fill="#5EC8FF" font-size="11" font-family="'Consolas', 'Courier New', monospace">select sum(o.amount) as total, o.customer_id</text>
      <text x="14" y="60" fill="#5EC8FF" font-size="11" font-family="'Consolas', 'Courier New', monospace">from orders o where o.amount &gt; 100 and o.status = 'DELIVERED'</text>
      <text x="14" y="76" fill="#5EC8FF" font-size="11" font-family="'Consolas', 'Courier New', monospace">group by o.customer_id</text>
    </g>

    <!-- Flaw Breakdown List -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="475" height="105" rx="6" fill="#140909" stroke="#FF5C5C" stroke-width="0.8" />
      
      <circle cx="16" cy="22" r="3" fill="#FF5C5C" />
      <text x="28" y="26" fill="#EAF4F0" font-size="11" font-weight="600">Table Qualifier Invariance:</text>
      <text x="195" y="26" fill="#91A8A2" font-size="10.5">o.amount vs amount triggers string mismatch</text>

      <circle cx="16" cy="48" r="3" fill="#FF5C5C" />
      <text x="28" y="52" fill="#EAF4F0" font-size="11" font-weight="600">Commutative Predicates:</text>
      <text x="195" y="52" fill="#91A8A2" font-size="10.5">(A AND B) vs (B AND A) order variance</text>

      <circle cx="16" cy="74" r="3" fill="#FF5C5C" />
      <text x="28" y="78" fill="#EAF4F0" font-size="11" font-weight="600">Projection Ordering:</text>
      <text x="195" y="78" fill="#91A8A2" font-size="10.5">SELECT order differs, output relation identical</text>

      <!-- Bottom Status Pill -->
      <line x1="0" y1="90" x2="475" y2="90" stroke="#17352F" stroke-width="0.5" />
      <text x="237" y="101" text-anchor="middle" fill="#FF5C5C" font-size="9" font-weight="700" letter-spacing="1">FALSE NEGATIVE IN CI/CD · BLOCKS PRODUCTION DEPLOYS</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: AST SEMANTIC MATCHER ================= -->
  <g transform="translate(625, 185)">
    <!-- Container Card -->
    <rect x="0" y="0" width="515" height="390" rx="10" fill="#0A1715" stroke="#2EE6A7" stroke-width="1.2" />
    <rect x="0" y="0" width="515" height="36" rx="10" fill="#0B201A" />
    
    <!-- Header -->
    <circle cx="20" cy="18" r="4" fill="#2EE6A7" />
    <text x="32" y="22" fill="#2EE6A7" font-size="12" font-weight="700" letter-spacing="0.8">AST SEMANTIC MATCHER // SQLGLOT PIPELINE</text>
    <text x="495" y="22" text-anchor="end" fill="#2EE6A7" font-size="11" font-weight="700">DETERMINISTIC 100%</text>

    <!-- Step 1: Parse to Tree -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="475" height="52" rx="6" fill="#0B1D1A" stroke="#17352F" stroke-width="1" />
      <rect x="0" y="0" width="28" height="52" rx="6" fill="#123B30" />
      <text x="14" y="31" text-anchor="middle" fill="#2EE6A7" font-size="11" font-weight="800">01</text>
      <text x="40" y="22" fill="#2EE6A7" font-size="11" font-weight="700">Abstract Syntax Tree Parsing (sqlglot)</text>
      <text x="40" y="40" fill="#91A8A2" font-size="9.5" font-family="'Consolas', monospace">gt_ast = sqlglot.parse_one(gt_sql, read="databricks")</text>
    </g>

    <!-- Step 2: Qualifier Stripping & Normalization -->
    <g transform="translate(20, 112)">
      <rect x="0" y="0" width="475" height="52" rx="6" fill="#0B1D1A" stroke="#17352F" stroke-width="1" />
      <rect x="0" y="0" width="28" height="52" rx="6" fill="#123B30" />
      <text x="14" y="31" text-anchor="middle" fill="#2EE6A7" font-size="11" font-weight="800">02</text>
      <text x="40" y="22" fill="#2EE6A7" font-size="11" font-weight="700">Strip Qualifiers &amp; Unalias Projections</text>
      <text x="40" y="40" fill="#91A8A2" font-size="9.5" font-family="'Consolas', monospace">expr.unalias() · col.set("table", None) · lower()</text>
    </g>

    <!-- Step 3: Subtree Component Decomposition Grid -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="475" height="110" rx="6" fill="#06100E" stroke="#17352F" stroke-width="1" />
      
      <!-- Sub-card A: Tables -->
      <g transform="translate(15, 12)">
        <rect x="0" y="0" width="215" height="38" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="0.8" />
        <circle cx="12" cy="19" r="3" fill="#2EE6A7" />
        <text x="24" y="16" fill="#EAF4F0" font-size="10" font-weight="700">TABLE SET (Weight: 35%)</text>
        <text x="24" y="30" fill="#91A8A2" font-size="8.5" font-family="'Consolas', monospace">{'orders'} == {'orders'}</text>
      </g>

      <!-- Sub-card B: Projections -->
      <g transform="translate(245, 12)">
        <rect x="0" y="0" width="215" height="38" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="0.8" />
        <circle cx="12" cy="19" r="3" fill="#2EE6A7" />
        <text x="24" y="16" fill="#EAF4F0" font-size="10" font-weight="700">PROJECTIONS (Weight: 30%)</text>
        <text x="24" y="30" fill="#91A8A2" font-size="8.5" font-family="'Consolas', monospace">{'customer_id', 'sum(amount)'}</text>
      </g>

      <!-- Sub-card C: WHERE Conjuncts -->
      <g transform="translate(15, 58)">
        <rect x="0" y="0" width="215" height="40" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="0.8" />
        <circle cx="12" cy="20" r="3" fill="#2EE6A7" />
        <text x="24" y="16" fill="#EAF4F0" font-size="10" font-weight="700">WHERE CONJUNCTS (20%)</text>
        <text x="24" y="30" fill="#91A8A2" font-size="8.5" font-family="'Consolas', monospace">{"status = 'delivered'", 'amount &gt; 100'}</text>
      </g>

      <!-- Sub-card D: GROUP BY -->
      <g transform="translate(245, 58)">
        <rect x="0" y="0" width="215" height="40" rx="4" fill="#0B1D1A" stroke="#17352F" stroke-width="0.8" />
        <circle cx="12" cy="20" r="3" fill="#2EE6A7" />
        <text x="24" y="16" fill="#EAF4F0" font-size="10" font-weight="700">GROUP BY SET (15%)</text>
        <text x="24" y="30" fill="#91A8A2" font-size="8.5" font-family="'Consolas', monospace">{'customer_id'}</text>
      </g>
    </g>

    <!-- Step 4: Verification Result Banner -->
    <g transform="translate(20, 295)">
      <rect x="0" y="0" width="475" height="75" rx="6" fill="#09221B" stroke="#2EE6A7" stroke-width="1.2" />
      <circle cx="20" cy="24" r="5" fill="#2EE6A7" />
      <text x="34" y="28" fill="#2EE6A7" font-size="12" font-weight="800">AST EQUIVALENCE: 1.0 (VERIFIED PASS)</text>
      
      <text x="20" y="48" fill="#EAF4F0" font-size="10" font-weight="600">Zero Databricks Cluster Compute Required · Sub-10ms CI/CD Execution</text>
      <text x="20" y="64" fill="#91A8A2" font-size="9" font-family="'Consolas', monospace">In-memory structural verification prevents broken semantic models in production.</text>
    </g>
  </g>

  <!-- ================= FOOTER STRIP ================= -->
  <g transform="translate(60, 595)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#17352F" stroke-width="1" />
    <circle cx="6" cy="22" r="3" fill="#2EE6A7" />
    <text x="18" y="26" fill="#EAF4F0" font-size="11" font-weight="700">Mansi Dhruv</text>
    <text x="100" y="26" fill="#91A8A2" font-size="11">· Lead Data Engineer &amp; Solution Architect</text>

    <text x="1080" y="26" text-anchor="end" fill="#2EE6A7" font-size="11" font-family="'Consolas', monospace">github.com/MsMansiDhruv/sentinel-lakehouse</text>
  </g>
</svg>