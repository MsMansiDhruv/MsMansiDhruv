<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBF8F1"/>
    <stop offset="0.55" stop-color="#F5F1E8"/>
    <stop offset="1" stop-color="#EDF4FB"/>
  </linearGradient>
  <style>
    .k{font:12px "DejaVu Sans Mono",monospace;letter-spacing:2px;fill:#73787D}
    .h{font:700 26px Georgia,serif;fill:#171B1E}
    .s{font:14px "DejaVu Sans Mono",monospace;fill:#62686D}
    .box{fill:#FFFDF8;fill-opacity:.84;stroke:#7B838A;stroke-opacity:.2}
    .line{fill:none;stroke:#8D949A;stroke-width:2;stroke-opacity:.24}
    .pipe{fill:none;stroke:#2E63D7;stroke-width:3;stroke-dasharray:12 10;stroke-linecap:round;animation:flow 4s linear infinite}
    .hot{fill:#E8762E}
    .cool{fill:#2E63D7}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .fade{animation:fade 2.8s ease-in-out infinite}
    .packet{animation:packet 4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-132}}
    @keyframes pulse{50%{opacity:.35;transform:scale(.72)}}
    @keyframes fade{50%{opacity:.45}}
    @keyframes packet{0%{opacity:0;transform:translateX(-20px)}10%,75%{opacity:1}100%{opacity:0;transform:translateX(900px)}}
  </style>
</defs>

<rect width="1400" height="440" rx="28" fill="url(#paper)"/>
<text x="42" y="42" class="k">SENTINEL LAKEHOUSE / LIVE SYSTEM MAP</text>
<text x="42" y="76" class="h">Raw → Clean → Reliable → Useful</text>
<text x="42" y="104" class="s">schema evolution · quality gates · CDC · dimensional models · observability</text>

<g transform="translate(42 140)">
  <rect x="0" y="0" width="250" height="128" rx="20" class="box"/>
  <text x="24" y="34" class="k">01 / BRONZE</text>
  <text x="24" y="64" class="h">INGEST</text>
  <text x="24" y="92" class="s">Auto Loader · CDC</text>
  <circle cx="212" cy="30" r="7" class="cool pulse"/>
  <circle cx="226" cy="30" r="5" class="hot pulse"/>

  <rect x="325" y="0" width="250" height="128" rx="20" class="box"/>
  <text x="349" y="34" class="k">02 / QUALITY</text>
  <text x="349" y="64" class="h">GUARD</text>
  <text x="349" y="92" class="s">validate · quarantine</text>
  <circle cx="537" cy="30" r="7" class="hot pulse"/>

  <rect x="650" y="0" width="250" height="128" rx="20" class="box"/>
  <text x="674" y="34" class="k">03 / SILVER</text>
  <text x="674" y="64" class="h">SHAPE</text>
  <text x="674" y="92" class="s">dedupe · SCD · CDF</text>
  <circle cx="862" cy="30" r="7" class="cool pulse"/>

  <rect x="975" y="0" width="250" height="128" rx="20" class="box"/>
  <text x="999" y="34" class="k">04 / GOLD</text>
  <text x="999" y="64" class="h">SERVE</text>
  <text x="999" y="92" class="s">marts · BI · analytics</text>
  <circle cx="1187" cy="30" r="7" class="hot pulse"/>

  <path d="M250 64 H325 M575 64 H650 M900 64 H975" class="pipe"/>
  <circle cx="120" cy="64" r="8" class="hot packet"/>
  <circle cx="430" cy="64" r="7" class="cool packet" style="animation-delay:-1.2s"/>
  <circle cx="755" cy="64" r="7" class="hot packet" style="animation-delay:-2.2s"/>

  <rect x="325" y="165" width="250" height="92" rx="18" class="box"/>
  <text x="349" y="196" class="k">EXCEPTION PATH</text>
  <text x="349" y="226" class="h">QUARANTINE</text>
  <text x="349" y="248" class="s">keep bad data visible</text>
  <path d="M450 128 V165" class="pipe"/>
  <circle cx="450" cy="148" r="6" class="hot fade"/>

  <rect x="650" y="165" width="250" height="92" rx="18" class="box"/>
  <text x="674" y="196" class="k">OBSERVABILITY</text>
  <text x="674" y="226" class="h">MEASURE</text>
  <text x="674" y="248" class="s">quality · latency · cost</text>
  <path d="M775 128 V165" class="pipe"/>
  <circle cx="775" cy="148" r="6" class="cool fade"/>
</g>

<text x="1100" y="394" class="k">THE PIPELINE IS THE PRODUCT</text>
<circle cx="1080" cy="390" r="5" class="hot pulse"/>
<circle cx="1095" cy="390" r="5" class="cool pulse"/>
</svg>